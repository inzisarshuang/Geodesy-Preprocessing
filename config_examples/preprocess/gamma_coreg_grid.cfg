# PATH CONTRACT / 处理链路径契约
# STEP / 步骤：PRE · GAMMA radar-grid coregistration
# RUN / 运行：geodesy-pre-gamma-coreg-grid --config PROJECT/config/preprocess/gamma_coreg_grid.cfg --case nisar_la --dry-run
# 去掉 --dry-run 后执行配准。
# ROOT / 根目录：project=SENSOR/CASE；processing_root=SENSOR/CASE/METHOD。
# INPUTS / 输入：SLC、images_file 与 RSLC/GEOCODING/reference_geometry.json。
# OUTPUTS / 输出：默认 processing_root/RSLC；快视图在 FIGURES/PRE/RSLC。
# DOWNSTREAM / 下游：可选 RSLC/SUBSET，随后进入 Analysis。
# RERUN / 重跑：每次正式调用都重新配准；成功后原子替换旧栈，失败保留旧结果。

# =============================================================================
# GAMMA 普通雷达坐标 SLC → RSLC 配准
# 功能用途：把一个单频 SLC 栈配准到明确参考日期，发布完整 RSLC 栈清单。
# 适用范围：NISAR、ALOS-2、COSMO、LT-1、RADARSAT-2、SAOCOM 雷达坐标 SLC。
# 不适用范围：Sentinel-1 TOPS、GSLC、干涉、滤波、解缠或形变分析。
# 上一步：geodesy-pre-gamma-geo-ref-grid 已发布 reference_geometry.json。
# 下一步：geodesy-pre-gamma-rslc-crop 按 KML 缓冲区裁剪完整注册栈。
#
# 查看帮助：
#   geodesy-pre-gamma-coreg-grid --help
# 只检查，不运行：
#   geodesy-pre-gamma-coreg-grid --config PROJECT/config/preprocess/gamma_coreg_grid.cfg --case nisar_la --dry-run
# 正式运行：
#   geodesy-pre-gamma-coreg-grid --config PROJECT/config/preprocess/gamma_coreg_grid.cfg --case nisar_la
# =============================================================================

[project]
# 此项必须填写。项目根目录；其他相对路径均从这里解析且不能越界。
root = /path/to/research-project

[defaults]
# 必须与参考几何和后续裁剪采用的视数一致。
range_looks = 5
azimuth_looks = 3
# standard（默认）使用 SLC_coreg.py。offset_field 额外执行偏移场精配准。
# 模式、传感器、方向和极化均不区分大小写。
refinement = standard
# 可选 auto（默认，按传感器选择）、0（单程，仅 lt1）、1（重复轨，其余支持的传感器）。
sar_mode = auto
# strict（默认）遇到硬质量失败时不发布。diagnostic 发布完整栈供科研对比，
# 但仍在 quality.json 中保留 failed，建议为它设置独立的 DIAGNOSTIC 输出目录。
quality_policy = strict
# 像元单位。达到 warning 会记录告警；达到 failure 时 strict 禁止发布，
# diagnostic 则发布并明确标记 failed。
warning_offset_stddev = 0.15
failure_offset_stddev = 0.30
warning_residual_offset = 0.20
failure_residual_offset = 0.50

# SLC_coreg.py 的初始偏移拟合参数，对应旧 offset_fit 末尾的 6。
# 只能取 1、3、4、6；常规二维仿射拟合保持 6。
offset_polynomial_parameters = 6
# 初始偏移估计在距离向/方位向使用的估计点数量。
# 对应 SLC_coreg.py 的 --nr/--naz；旧流程两项均为 128。
offset_range_estimates = 128
offset_azimuth_estimates = 128
# 初始相关窗口，对应 --rwin/--azwin 和旧 offset_pwr 的 256 256。
# 较大窗口通常更稳但更慢，并可能平滑局部变化；不得小于 8。
offset_range_window = 256
offset_azimuth_window = 256
# 初始相关过采样与最低相关系数，对应 --n_ovr/--thres。
# 过采样只能取 1、2、4；阈值在 0 到 1 之间。弱相关时先检查数据和窗口，再降低阈值。
offset_oversampling = 1
offset_correlation_threshold = 0.35

# 只在 refinement = offset_field 时生效。精配准网格步长，对应 --rstep/--azstep。
refine_range_step = 128
refine_azimuth_step = 128
# 只在 refinement = offset_field 时生效。精配准相关窗口，对应 --rwin/--azwin。
refine_range_window = 256
refine_azimuth_window = 256
# 只在 refinement = offset_field 时生效。精配准过采样可取 1（默认）、2、4。
refine_oversampling = 1
# 只在 refinement = offset_field 时生效。精配准最低相关系数。
refine_correlation_threshold = 0.35

[case:nisar_la]
project = NISAR/LA
processing_root = NISAR/LA/GAMMA
# 此项必须填写。允许 nisar、alos2、saocom、rsat2、cosmo、lt1。
sensor = nisar
# 此项必须填写。每个 case 填一个与输入匹配的频率标识。NISAR LA 填 A，LB 另建 case 填 B。
frequency = A
# 此项必须填写。从筛选 CSV/HDF5 核对；一个 case 只能包含同一轨道、帧和方向。
track = 87
frame = 22
# 处理 NISAR 时必须填写。可选 ascending（升轨）或 descending（降轨）。其他传感器可留空。
orbit_direction = descending
# 此项必须填写。必须与 reference_geometry.json 和 images_file 一致。
reference_date = 20240229
# 此项必须填写。从 selected_polarizations 中选一个极化（HH、HV、VH 或 VV）用于估计 lookup/off。
primary_polarization = HH
# 此项必须填写。可选 HH、HV、VH、VV，多个值用逗号分隔且不可重复。
# 次极化仅在网格、轨道和采集几何一致时复用主极化。
selected_polarizations = HH
# 此项必须填写。SLC 根目录，例如 HH_SLC/YYYYMMDD/YYYYMMDD.slc。
slc_dir = NISAR/LA/GAMMA/SLC
# 此项必须填写。完整、唯一的 YYYYMMDD 日期清单。
images_file = NISAR/LA/GAMMA/SLC/images_nisar_la
# 此项必须填写。上一阶段发布的参考几何清单。
reference_geometry = NISAR/LA/GAMMA/RSLC/GEOCODING/reference_geometry.json
# RSLC 输出目录。未配置项目和方法路径时必须填写。新栈验证成功后替换旧目录。
output_dir = NISAR/LA/GAMMA/RSLC
figure_dir = NISAR/LA/GAMMA/FIGURES/PRE/RSLC

# 可选 Frequency B；它必须独立配准，不能复用 LA 的像元尺寸或 lookup table。
[case:nisar_lb]
project = NISAR/LB
processing_root = NISAR/LB/GAMMA
# 此项必须填写。可选 nisar、alos2、saocom、rsat2、cosmo、lt1。
sensor = nisar
# 此项必须填写。单个频率标识。NISAR LA 用 A，LB 用 B。
frequency = B
track = 87
frame = 22
# 处理 NISAR 时必须填写。可选 ascending、descending。其他传感器可留空。
orbit_direction = descending
reference_date = 20240229
# 此项必须填写。从 selected_polarizations 选 HH、HV、VH 或 VV。
primary_polarization = HH
# 此项必须填写。可选 HH、HV、VH、VV，多个值用逗号分隔且不可重复。
selected_polarizations = HH
slc_dir = NISAR/LB/GAMMA/SLC
images_file = NISAR/LB/GAMMA/SLC/images_nisar_lb
reference_geometry = NISAR/LB/GAMMA/RSLC/GEOCODING/reference_geometry.json
output_dir = NISAR/LB/GAMMA/RSLC
figure_dir = NISAR/LB/GAMMA/FIGURES/PRE/RSLC

# =============================================================================
# 处理逻辑
#   主极化非参考景：SLC_coreg.py；次极化：SLC_interp_lt 复用主极化几何；
#   offset_field 模式在标准配准后显式调用 SLC_coreg_refine.py。
#   固定任务标识：PRE_GAMMA_SAR_RADAR_COREG。
#
# 结果保存
#   output_dir 内含各日期/极化 RSLC、RMLI、lookup/off、逐景质量、images、
#   quality.json、provenance.json 和 registered_stack.json。
#
# 日志
#   Workflow 分类建议使用 LOG/PRE/GAMMA/SAR_RADAR_GRID_COREG；每景命令 stdout/stderr
#   随发布目录保留在 logs/日期/极化，便于定位具体失败景。
#
# 完成判断
#   1. strict 模式下终端所有景为 reference/complete/warning，无 failed；
#   2. registered_stack.json 可读取且引用完整日期 × 极化网格；
#   3. diagnostic 模式允许 quality.json 为 failed，但必须使用独立输出目录，
#      仅用于干涉图、算法对比和论文诊断，不能冒充通过质量检查的生产栈；
#   4. 真实中心频率来自每个 .slc.par 且全栈一致。
#
# 重新运行
#   每次正式运行都执行完整配准，不根据旧输入签名跳过。新栈全部验证成功后
#   原子替换 output_dir；运行或发布失败时旧结果保持不变。失败日志保存在输出同级的
#   `<目录>.failed-logs-<编号>` 中。
#
# 凭据安全
#   本步骤不联网，不需要账号、密码、令牌或 API key；CFG 不得保存凭据。
# =============================================================================

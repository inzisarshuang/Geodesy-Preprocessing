# PATH CONTRACT / 处理链路径契约
# STEP / 步骤：PRE · GAMMA TOPS reference geocoding
# RUN / 运行：geodesy-pre-gamma-geo-ref-tops --config PROJECT/config/preprocess/gamma_geo_ref_tops.cfg --case main
# ROOT / 根目录：project=SENSOR/CASE；processing_root=SENSOR/CASE/METHOD。
# INPUTS / 输入：processing_root/SLC 与 TOPOGRAPHY/GAMMA DEM。
# OUTPUTS / 输出：默认 RSLC/GEOCODING；快视图在 FIGURES/PRE/RSLC_GEOCODING。
# DOWNSTREAM / 下游：TOPS coreg 使用该几何生成 RSLC。
# RERUN / 重跑：每次正式调用都重建几何；新结果成功后原子替换旧目录。

# GAMMA TOPS 参考景几何配置（正式模板）
# 功能用途：用参考日期的 SLC 和 GAMMA DEM 建立后续 TOPS 配准所需的几何产品。
# 输入：SLC、srtm.dem/srtm.dem.par；输出：DEM_geocode 参考几何文件。
# 适用范围：GAMMA Sentinel-1 TOPS；不适用范围：普通条带/radar-grid 与 NISAR GSLC。
# 本阶段不生成 RSLC 或干涉图。上一步：GAMMA TOPS SLC；下一步：GAMMA TOPS coreg。
# 查看帮助：conda run -n envInSAR geodesy-pre-gamma-geo-ref-tops --help
# 正式运行：conda run -n envInSAR geodesy-pre-gamma-geo-ref-tops --config <项目>/config/preprocess/gamma_geo_ref_tops.cfg --case main
# 结果保存：output_dir。日志：Workflow 写入项目 LOG；直接运行只输出到终端。
# 完成判断：退出码为 0，且 output_dir 中计划的 lookup、height、incidence 等文件完整。
# 重新运行：完整结果和残留目录都会重算；失败时保留运行前的旧结果。
# 凭据安全：本步骤不联网，配置中不得填写账号、密码或密钥。
# reference、range_looks、azimuth_looks 必须与 SLC 和 coreg 配置完全一致。

[project]
# 此项必须填写。相对路径基准；配置位于 <项目>/config/preprocess 时通常为 ../..。
root = ../..

[defaults]
# [defaults] 为所有 case 提供公共值。
# GAMMA DEM 所在目录。
dem_dir = DEM
# 必须与 SLC/coreg 一致的距离向和方位向多视数。
range_looks = 7
azimuth_looks = 2
# auto 或 - 根据 DEM 与雷达网格计算过采样，也可填正数。
# 纬向与经向必须均为自动或均为正数。auto 不区分大小写。
latitude_oversampling = auto
longitude_oversampling = auto
# gc_map2 偏移参考影像。0 = 实际 SAR，1 = 模拟 SAR（本模板设置）。
reference_flag = 1
# gc_map2 入射角。0 = 相对地表法线（本模板设置），1 = 相对椭球法线。
incidence_flag = 0

[case:main]
# [case:main] 是由 --case main 选择的一组任务。
# 此项必须填写。YYYYMMDD 参考日期，必须真实存在于 slc_dir。
reference = 20240101
# 此项必须填写。上一阶段逐景 SLC 根目录。
slc_dir = S1/ASCENDING_154/GAMMA/SLC
# 本阶段结果目录。未配置项目和方法路径时必须填写。
output_dir = S1/ASCENDING_154/GAMMA/RSLC/GEOCODING
figure_dir = S1/ASCENDING_154/GAMMA/FIGURES/PRE/RSLC_GEOCODING
project = S1/ASCENDING_154
processing_root = S1/ASCENDING_154/GAMMA

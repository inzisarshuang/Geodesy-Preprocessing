# PATH CONTRACT / 处理链路径契约
# STEP / 步骤：PRE · GAMMA radar-grid SLC
# RUN / 运行：geodesy-pre-gamma-slc-grid --config PROJECT/config/preprocess/gamma_slc_grid.cfg --case main --dry-run
# 去掉 --dry-run 后正式导入 SLC。
# ROOT / 根目录：project=SENSOR/CASE；processing_root=SENSOR/CASE/METHOD。
# INPUTS / 输入：DOWNLOAD 下的供应商聚焦产品。
# OUTPUTS / 输出：默认 processing_root/SLC；快视图集中到 FIGURES/PRE/SLC。
# DOWNSTREAM / 下游：参考几何与 RSLC 配准读取 SLC 和 images_file。
# RERUN / 重跑：每次正式调用都重新导入所有景；成功后事务式替换旧产品。

# =============================================================================
# GAMMA 雷达网格 SLC 生成
# 功能用途：导入供应商产品；适用范围：七类 GAMMA 雷达网格传感器；
# 不适用范围：TOPS、NISAR GSLC 和分析。上一步：准备供应商产品；
# 下一步：参考几何/配准。结果保存：由 slc_dir/images_file 指定。
# 重新运行：遵循文末重跑规则。
#
# 功能：把七类供应商聚焦产品导入 GAMMA SLC，并生成有序影像日期表。
# 输入：ALOS-2、CSG、CSKS、LT-1、RADARSAT-2、SAOCOM 或 NISAR RSLC。
# 输出：按卫星/极化组织的 GAMMA .slc、.slc.par、预览图和 images 文件。
# 适用：非 TOPS 雷达网格产品；支持的 sensor 值见下方 case。
# 不适用：Sentinel-1 TOPS、NISAR GSLC、配准、干涉、解缠或形变分析。
# 边界：本步骤只生成各景 SLC；下一步再建立几何并生成配准后的 RSLC。
#
# 前置步骤：下载供应商原始/聚焦产品，并在 GAMMA 终端配置对应导入命令。
# 后续步骤：geodesy-pre-gamma-geo-ref-grid 和 geodesy-pre-gamma-coreg-grid。
#
# 复制模板：
#   cp /path/to/gamma_slc_grid.cfg PROJECT/config/preprocess/gamma_slc_grid.cfg
# 查看帮助：
#   geodesy-pre-gamma-slc-grid --help
# 只检查、不处理：
#   geodesy-pre-gamma-slc-grid --config PROJECT/config/preprocess/gamma_slc_grid.cfg --case main --dry-run
# 正式运行：
#   geodesy-pre-gamma-slc-grid --config PROJECT/config/preprocess/gamma_slc_grid.cfg --case main
# =============================================================================

# -----------------------------------------------------------------------------
# [project]
# 所有 defaults/case 相对路径均从项目根目录解析，并禁止逃出该目录。
# -----------------------------------------------------------------------------
[project]
# 此项必须填写。类型：路径。项目输入、工作结果和日志应保留在这里。
root = /path/to/research-project

# -----------------------------------------------------------------------------
# [defaults]
# 每个 [case:name] 自动继承；case 中同名键覆盖默认值，允许配置多个 case。
# -----------------------------------------------------------------------------
[defaults]
# 传感器、极化和 NISAR adapter.* 选项的值均不区分大小写。
# 可选 HH（默认）、HV、VH、VV。多个值用逗号分隔且不可重复，须为产品实际包含的极化。
polarizations = HH
# 正整数。多视和预览使用；不同任务间保持一致以便后续配准。
range_looks = 10
azimuth_looks = 10
# Workflow 任务标识；新配置固定使用 GAMMA 名称。
workflow_task = PRE_GAMMA_SAR_SLC
# 以下值是“命令及固定参数”，按 argv 解析而不经过 shell。
# 不要使用 ;、|、重定向或 $()。留下注释表示采用卫星适配器默认命令。
# import_command = /path/to/vendor_import_command
# orbit_filter_command = /path/to/ORB_filt_spline.py
# multi_look_command = /path/to/multi_look
# preview_command = /path/to/rasSLC

# -----------------------------------------------------------------------------
# [case:main]
# 一个 case 代表一个传感器、研究区/轨道和输出栈；用 --case main 选择。
# -----------------------------------------------------------------------------
[case:main]
project = ALOS2/MAIN
processing_root = ALOS2/MAIN/GAMMA
# 此项必须填写。可选 alos2、csg、csks、lt1、rsat2、saocom、nisar。
sensor = alos2
# 此项必须填写。供应商输入目录，只读；压缩包会解到输出旁的临时目录。
raw_dir = ALOS2/DOWNLOAD
# GAMMA SLC 工作目录。配置项目和方法路径后可省略，默认采用 <processing_root>/SLC。
slc_dir = ALOS2/MAIN/GAMMA/SLC
figure_dir = ALOS2/MAIN/GAMMA/FIGURES/PRE/SLC
# 有序 YYYYMMDD 日期表；后续几何和配准 CFG 必须引用同一文件。
images_file = ALOS2/MAIN/GAMMA/SLC/images_alos2

# -----------------------------------------------------------------------------
# NISAR Frequency A（LA）示例：默认、正式推荐。
# 下载步骤生成的 HDF5 保持只读；par_NISAR_RSLC 输出 FCOMPLEX GAMMA SLC。
# -----------------------------------------------------------------------------
[case:nisar_la]
project = NISAR/LA
processing_root = NISAR/LA/GAMMA
# 此项必须填写。可选 alos2、csg、csks、lt1、rsat2、saocom、nisar。下方 adapter.* 仅 nisar 可用。
sensor = nisar
raw_dir = NISAR/DOWNLOAD/RSLC
slc_dir = NISAR/LA/GAMMA/SLC
figure_dir = NISAR/LA/GAMMA/FIGURES/PRE/SLC
images_file = NISAR/LA/GAMMA/SLC/images_nisar_la
# 可选 HH、HV、VH、VV，多个值用逗号分隔且不可重复。
polarizations = HH
# 仅 nisar。可选 L（默认）或 S，须与 HDF5 数据集一致。
adapter.band = L
# 仅 nisar。可选 A（默认）或 B，须与 HDF5 数据集一致。
adapter.frequency = A
# 仅 nisar。可选 none、beta0（默认）、sigma0、gamma0，分别传给 GAMMA 的 0、1、2、3。
adapter.radiometric_calibration = beta0
# 仅 nisar。false（默认）关闭噪声扣除，true 开启，分别传给 GAMMA 的 0 和 1。
adapter.noise_subtraction = false

# -----------------------------------------------------------------------------
# NISAR Frequency B（LB）可选示例。
# 只有获取配置使用 main_plus_auxiliary 且每景都存在 B 时才运行本 case；LA/LB
# 分开输出，不能假设采样尺寸相同，也不能根据 A/B 名称推断实际中心频率高低。
# -----------------------------------------------------------------------------
[case:nisar_lb]
project = NISAR/LB
processing_root = NISAR/LB/GAMMA
# 此项必须填写。可选 alos2、csg、csks、lt1、rsat2、saocom、nisar。下方 adapter.* 仅 nisar 可用。
sensor = nisar
raw_dir = NISAR/DOWNLOAD/RSLC
slc_dir = NISAR/LB/GAMMA/SLC
figure_dir = NISAR/LB/GAMMA/FIGURES/PRE/SLC
images_file = NISAR/LB/GAMMA/SLC/images_nisar_lb
# 可选 HH、HV、VH、VV，多个值用逗号分隔且不可重复。
polarizations = HH
# 仅 nisar。可选 L（默认）或 S，须与 HDF5 数据集一致。
adapter.band = L
# 仅 nisar。可选 A（默认）或 B，本 case 使用 B。
adapter.frequency = B
# 仅 nisar。可选 none、beta0（默认）、sigma0、gamma0。
adapter.radiometric_calibration = beta0
# 仅 nisar。false（默认）关闭噪声扣除，true 开启。
adapter.noise_subtraction = false

# =============================================================================
# 结果和日志
#   结果：slc_dir 下按适配器既有目录发布 SLC/参数/预览；images_file 为日期表。
#   日志：每景输出旁保存命令 stdout/stderr；Workflow 记录位于 LOG/PRE/GAMMA。
# 完成判断
#   1. 每个发现日期和所需极化都有非空 SLC 与参数文件；
#   2. images_file 日期去重、排序，并与完整结果一致；
#   3. 终端进度达到总景数，failed 为 0。
# 重跑规则
#   - 完整景和残留产品都重新生成，不根据旧签名跳过；
#   - 每景先在同文件系统暂存，全部验证后成组替换；
#   - 输入产品始终只读；失败后修复原因再重跑。
# 常见问题
#   1. no source products：检查 sensor 与供应商目录层级、文件名和产品级别。
#   2. command not found：进入 GAMMA 环境并检查对应导入程序。
#   3. incomplete output group：检查输出目录权限、符号链接或外部并发修改。
#   4. polarization missing：按产品实际极化修改 polarizations。
# 凭据安全
#   本步骤不下载数据；CFG 不应包含卫星账户、密码、令牌或 API key。
# =============================================================================

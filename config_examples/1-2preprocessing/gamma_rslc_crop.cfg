# PATH CONTRACT / 处理链路径契约
# STEP / 步骤：PRE · GAMMA registered-stack subset
# ROOT / 根目录：project=SENSOR/CASE；processing_root=SENSOR/CASE/METHOD。
# INPUTS / 输入：processing_root/RSLC、RSLC/GEOCODING 与项目 ROI。
# OUTPUTS / 输出：默认 RSLC/SUBSET；快视图在 FIGURES/PRE/RSLC_SUBSET。
# DOWNSTREAM / 下游：Analysis 优先读取裁剪栈，未裁剪时读取完整 RSLC。
# REUSE / 复用：完整同签名裁剪跳过；残缺或不匹配结果不自动覆盖。

# GAMMA 注册栈 KML 裁剪配置（正式模板）
# 功能用途：根据研究区 KML 和外扩缓冲区，为完整 GAMMA RSLC 注册栈计算统一窗口，
#           检查覆盖范围，并把所选极化裁剪成预处理最终产品。
# 适用范围：已经完成配准并具有 registered_stack.json、mli.par、utm.dem.par 和
#           lt_fine 的 GAMMA radar-grid 注册栈。
# 不适用范围：未配准 SLC、NISAR GSLC、干涉图生成、滤波、解缠或时序分析。
# 上一步：geodesy-pre-gamma-coreg-tops 或其他能发布兼容注册栈清单的配准程序。
# 下一步：在 Geodesy-Analysis 中从裁剪栈开始 baseline_select 和干涉分析。
#
# 查看帮助：
#   conda run -n envInSAR geodesy-pre-gamma-rslc-crop --help
# 先检查范围，不裁剪 RSLC：
#   conda run -n envInSAR geodesy-pre-gamma-rslc-crop \
#     --config <项目>/config/preprocessing/gamma_rslc_crop.cfg \
#     --case main --plan-only
# 正式运行：
#   conda run -n envInSAR geodesy-pre-gamma-rslc-crop \
#     --config <项目>/config/preprocessing/gamma_rslc_crop.cfg --case main
#
# 结果保存：output_dir 下包含 RSLC、registered_stack.json、images、crop_window.json、
#           KML 缓冲区、地图/雷达掩膜和 quicklooks；完整源 RSLC 不会被修改。
# 日志：Workflow 运行时写入项目 LOG/PRE/GAMMA；直接运行时显示简洁进度。
# 完成判断：命令返回 0，输出清单状态 complete，全部日期和所选极化均有非空
#           .rslc/.rslc.par，crop_window.json 记录覆盖率和同一裁剪窗口。
# 重新运行：每次重新计算；成功后原子替换已有输出，失败时保留旧结果。
#           --plan-only 不会因已有的不完整裁剪输出而报错，只更新检查计划目录。
#           源注册栈始终只读。
# 凭据安全：本步骤不联网，不要在本文件写账号、密码、API key 或 token。

[project]
# 【必填】所有相对路径的基准；通常从 config/preprocessing 返回项目根目录。
root = ../..

[defaults]
# 【常改】KML 向外缓冲公里数；默认 5 km，避免研究区边缘被裁掉。
buffer_km = 5
# 【常改】逗号分隔极化，如 VV、HH,HV；使用 all 表示清单中的全部极化。
polarizations = VV
# 【通常不改】原始 KML 必须全部位于有效 lookup 覆盖内。
require_full_aoi_coverage = true
# 【谨慎修改】缓冲区最低覆盖比例。0.95 表示至少覆盖 95%。
min_buffer_coverage = 0.95

[case:main]
project = S1/ASCENDING_154
processing_root = S1/ASCENDING_154/GAMMA
# 【必填】【常改】完整配准栈发布的 v2 清单。
registered_stack = S1/ASCENDING_154/GAMMA/RSLC/registered_stack.json
# 【必填】【常改】包含参考日期 mli.par、utm.dem.par 和 lt_fine 的目录。
geometry_dir = S1/ASCENDING_154/GAMMA/RSLC/GEOCODING
# 【必填】【常改】项目内 WGS84 Polygon/MultiGeometry KML。
kml_file = AOI/study_area.kml
# 【通常不改】留空表示合并 KML 中所有 Polygon；填写时只读取同名 Placemark。
kml_placemark =
# 【必填】【常改】裁剪注册栈正式目录；不得等于或位于完整 RSLC 目录内部。
output_dir = S1/ASCENDING_154/GAMMA/RSLC/SUBSET
figure_dir = S1/ASCENDING_154/GAMMA/FIGURES/PRE/RSLC_SUBSET

# NISAR LA 的连贯路径示例；这是 NISAR 常规预处理默认使用的 case。
[case:nisar_la]
project = NISAR/LA
processing_root = NISAR/LA/GAMMA
registered_stack = NISAR/LA/GAMMA/RSLC/registered_stack.json
geometry_dir = NISAR/LA/GAMMA/RSLC/GEOCODING
kml_file = INPUT/ROI/area.kml
kml_placemark =
output_dir = NISAR/LA/GAMMA/RSLC/SUBSET
figure_dir = NISAR/LA/GAMMA/FIGURES/PRE/RSLC_SUBSET
polarizations = HH

# 可选 LB；只有完成独立 LB 导入、几何和配准后才运行。
[case:nisar_lb]
project = NISAR/LB
processing_root = NISAR/LB/GAMMA
registered_stack = NISAR/LB/GAMMA/RSLC/registered_stack.json
geometry_dir = NISAR/LB/GAMMA/RSLC/GEOCODING
kml_file = INPUT/ROI/area.kml
kml_placemark =
output_dir = NISAR/LB/GAMMA/RSLC/SUBSET
figure_dir = NISAR/LB/GAMMA/FIGURES/PRE/RSLC_SUBSET
polarizations = HH

# =============================================================================
# GAMMA 普通雷达坐标 SLC 参考几何
# 功能用途：为非 TOPS 的 GAMMA SLC 栈建立地形辅助参考几何。
# 适用范围：NISAR、ALOS-2、COSMO、LT-1、RADARSAT-2、SAOCOM 等雷达坐标 SLC。
# 不适用范围：Sentinel-1 TOPS、GSLC、干涉图、解缠或形变分析。
# 上一步：供应商数据已经由对应 GAMMA SLC 导入步骤生成完整 SLC 和 images 日期表。
# 下一步：使用 geodesy-pre-gamma-sar-coreg 生成按统一参考几何配准的 RSLC 栈。
#
# 查看帮助：
#   geodesy-pre-gamma-sar-geo-ref --help
# 只检查，不运行 GAMMA：
#   geodesy-pre-gamma-sar-geo-ref --config PROJECT/CONFIG/preprocessing/gamma_sar_geo_ref.cfg --case nisar_la --dry-run
# 正式运行：
#   geodesy-pre-gamma-sar-geo-ref --config PROJECT/CONFIG/preprocessing/gamma_sar_geo_ref.cfg --case nisar_la
# =============================================================================

[project]
# 【必填】【常改】研究项目根目录；下方所有相对路径都从这里解析且不得越界。
root = /path/to/research-project

[defaults]
# 【常改】正整数；由分辨率和后续分析需求决定，不能为 0。
range_looks = 5
azimuth_looks = 3
# 【通常不改】auto 让 geocoding.py 自动计算；两个值必须同时为 auto 或同时为数字。
latitude_oversampling = auto
longitude_oversampling = auto
# 【谨慎修改】输出 DEM 采样间隔；设置后优先于经纬向过采样。auto 表示不传 --post。
post_spacing = auto
# 【谨慎修改】几何精化相关参数；相关阈值范围为 (0, 1]，多项式只能为 1/3/4/6。
correlation_threshold = 0.2
polynomial_parameters = 1
range_offset_estimates = auto
azimuth_offset_estimates = auto
range_window = 128
azimuth_window = 128
area_factor = 1.0

[case:nisar_la]
# 【必填】【常改】YYYYMMDD；必须出现在 images_file，且主极化 SLC 必须完整存在。
reference_date = 20240229
# 【必填】【常改】参考配准使用的主极化，例如 HH 或 VV。
primary_polarization = HH
# 【必填】【常改】SLC 根目录；典型结构为 HH_SLC/YYYYMMDD/YYYYMMDD.slc。
slc_dir = WORK/GAMMA/NISAR/LA/SLC
# 【必填】【常改】上一阶段发布的一行一个 YYYYMMDD 的日期清单。
images_file = WORK/GAMMA/NISAR/LA/images_nisar_la
# 【必填】【常改】GAMMA DEM 数据及严格配对参数文件，例如 srtm.dem 与 srtm.dem.par。
dem = WORK/DEM/srtm.dem
dem_par = WORK/DEM/srtm.dem.par
# 【必填】【常改】完整参考几何目录；已有残缺目录会停止，不会自动覆盖。
output_dir = WORK/GAMMA/NISAR/LA/GEOMETRY

# 可选 Frequency B。只有下载和导入时明确选择了辅助频率才运行。
[case:nisar_lb]
reference_date = 20240229
primary_polarization = HH
slc_dir = WORK/GAMMA/NISAR/LB/SLC
images_file = WORK/GAMMA/NISAR/LB/images_nisar_lb
dem = WORK/DEM/srtm.dem
dem_par = WORK/DEM/srtm.dem.par
output_dir = WORK/GAMMA/NISAR/LB/GEOMETRY

# =============================================================================
# 参数与运行说明
#   固定任务标识：PRE_GAMMA_SAR_RADAR_GEO_REF
#   程序先运行 multi_look，再运行当前 GAMMA geocoding.py；输入始终只读。
#
# 结果保存
#   output_dir 包含参考 MLI/参数、精化 lookup table、入射角、叠掩阴影图、
#   WGS84 椭球高雷达坐标高程图、geocoding_quality 和 reference_geometry.json。
#
# 日志
#   Workflow 日志分类使用 LOG/PRE/GAMMA/SAR_RADAR_GRID_GEO_REF；命令 stdout/stderr
#   也随事务式结果保留，失败信息会指出具体阶段。
#
# 完成判断
#   1. 命令返回 0，进度事件状态为 complete；
#   2. WGS84 高程、lt_fine、inc、ls_map 和质量文件均非空；
#   3. reference_geometry.json 记录输入摘要、GAMMA 版本和两条实际命令。
#
# 重新运行
#   完整且一致的 output_dir 自动跳过；残缺目录立即报错。若确需重算，请先人工
#   核对并移动旧目录，再重新运行，不要直接删除仍可能有用的成果。
#   失败命令的日志保存在 output_dir 同级的 `<目录>.failed-logs-<编号>` 中。
#
# 凭据安全
#   本步骤不联网，不需要账户、密码、令牌或 API key；不得把任何凭据写入 CFG。
# =============================================================================

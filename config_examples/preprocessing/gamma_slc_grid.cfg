# =============================================================================
# GAMMA 雷达网格 SLC 生成
# 功能用途：导入供应商产品；适用范围：七类 GAMMA 雷达网格传感器；
# 不适用范围：TOPS、NISAR GSLC 和分析。上一步：准备供应商产品；
# 下一步：参考几何/配准。结果保存：由 slc_dir/images_file 指定。
# 重新运行：遵循文末重跑规则。
#
# 功能：把七类供应商聚焦产品导入 GAMMA SLC，并生成有序影像日期表。
# 输入：ALOS-2、CSG、CSKS、LT-1、RADARSAT-2、SAOCOM 或 NISAR RSLC。
# 输出：按卫星/极化组织的 GAMMA .slc、.slc.par、预览图和 images 文件。
# 适用：非 TOPS 雷达网格产品；支持的 sensor 值见下方 case。
# 不适用：Sentinel-1 TOPS、NISAR GSLC、配准、干涉、解缠或形变分析。
# 边界：本步骤只生成各景 SLC；下一步再建立几何并生成配准后的 RSLC。
#
# 前置步骤：下载供应商原始/聚焦产品，并在 GAMMA 终端配置对应导入命令。
# 后续步骤：geodesy-pre-gamma-geo-ref-grid 和 geodesy-pre-gamma-coreg-grid。
#
# 复制模板：
#   cp /path/to/gamma_slc_grid.cfg PROJECT/CONFIG/preprocessing/gamma_slc_grid.cfg
# 查看帮助：
#   geodesy-pre-gamma-slc-grid --help
# 只检查、不处理：
#   geodesy-pre-gamma-slc-grid --config PROJECT/CONFIG/preprocessing/gamma_slc_grid.cfg --case main --dry-run
# 正式运行：
#   geodesy-pre-gamma-slc-grid --config PROJECT/CONFIG/preprocessing/gamma_slc_grid.cfg --case main
# =============================================================================

# -----------------------------------------------------------------------------
# [project]
# 所有 defaults/case 相对路径均从项目根目录解析，并禁止逃出该目录。
# -----------------------------------------------------------------------------
[project]
# 【必填】【常改】类型：路径。项目输入、工作结果和日志应保留在这里。
root = /path/to/research-project

# -----------------------------------------------------------------------------
# [defaults]
# 每个 [case:name] 自动继承；case 中同名键覆盖默认值，允许配置多个 case。
# -----------------------------------------------------------------------------
[defaults]
# 【常改】逗号分隔，允许 HH/HV/VH/VV；必须是产品真实包含的极化。
polarizations = HH
# 【常改】正整数。多视和预览使用；不同任务间保持一致以便后续配准。
range_looks = 10
azimuth_looks = 10
# 【通常不改】Workflow 任务标识；新配置固定使用 GAMMA 名称。
workflow_task = PRE_GAMMA_SAR_SLC
# 【谨慎修改】以下值是“命令及固定参数”，按 argv 解析而不经过 shell。
# 不要使用 ;、|、重定向或 $()。留下注释表示采用卫星适配器默认命令。
# import_command = /path/to/vendor_import_command
# orbit_filter_command = /path/to/ORB_filt_spline.py
# multi_look_command = /path/to/multi_look
# preview_command = /path/to/rasSLC

# -----------------------------------------------------------------------------
# [case:main]
# 一个 case 代表一个传感器、研究区/轨道和输出栈；用 --case main 选择。
# -----------------------------------------------------------------------------
[case:main]
# 【必填】【常改】允许值：alos2、csg、csks、lt1、rsat2、saocom、nisar。
sensor = alos2
# 【必填】【常改】供应商输入目录，只读；压缩包会解到输出旁的临时目录。
raw_dir = INPUT/ALOS2
# 【必填】【常改】GAMMA SLC 工作目录；建议明确位于 WORK/GAMMA/SLC。
slc_dir = WORK/GAMMA/SLC/ALOS2
# 【常改】有序 YYYYMMDD 日期表；后续几何和配准 CFG 必须引用同一文件。
images_file = WORK/GAMMA/SLC/ALOS2/images_alos2

# -----------------------------------------------------------------------------
# NISAR Frequency A（LA）示例：默认、正式推荐。
# 下载步骤生成的 HDF5 保持只读；par_NISAR_RSLC 输出 FCOMPLEX GAMMA SLC。
# -----------------------------------------------------------------------------
[case:nisar_la]
sensor = nisar
raw_dir = INPUT/NISAR/RSLC
slc_dir = WORK/GAMMA/NISAR/LA/SLC
images_file = WORK/GAMMA/NISAR/LA/images_nisar_la
polarizations = HH
# 【通常不改】NISAR band/frequency 必须与 HDF5 内真实数据集一致。
adapter.band = L
adapter.frequency = A
# 【常改】允许 none、beta0、sigma0、gamma0；配置层转换为 GAMMA 的 0/1/2/3。
adapter.radiometric_calibration = beta0
# 【谨慎修改】是否执行 GAMMA 噪声扣除，转换为 0/1。
adapter.noise_subtraction = false

# -----------------------------------------------------------------------------
# NISAR Frequency B（LB）可选示例。
# 只有获取配置使用 main_plus_auxiliary 且每景都存在 B 时才运行本 case；LA/LB
# 分开输出，不能假设采样尺寸相同，也不能根据 A/B 名称推断实际中心频率高低。
# -----------------------------------------------------------------------------
[case:nisar_lb]
sensor = nisar
raw_dir = INPUT/NISAR/RSLC
slc_dir = WORK/GAMMA/NISAR/LB/SLC
images_file = WORK/GAMMA/NISAR/LB/images_nisar_lb
polarizations = HH
adapter.band = L
adapter.frequency = B
adapter.radiometric_calibration = beta0
adapter.noise_subtraction = false

# =============================================================================
# 结果和日志
#   结果：slc_dir 下按适配器既有目录发布 SLC/参数/预览；images_file 为日期表。
#   日志：每景输出旁保存命令 stdout/stderr；Workflow 记录位于 LOG/PRE/GAMMA。
# 完成判断
#   1. 每个发现日期和所需极化都有非空 SLC 与参数文件；
#   2. images_file 日期去重、排序，并与完整结果一致；
#   3. 终端进度达到总景数，failed 为 0。
# 重跑规则
#   - 完整景自动跳过；残缺景立即报错且不删除；
#   - 每景先在同文件系统暂存，全部验证后成组发布；
#   - 输入产品始终只读；失败后修复原因再重跑。
# 常见问题
#   1. no source products：检查 sensor 与供应商目录层级、文件名和产品级别。
#   2. command not found：进入 GAMMA 环境并检查对应导入程序。
#   3. incomplete output group：移动残缺结果或确认来源后再重新生成。
#   4. polarization missing：按产品实际极化修改 polarizations。
# 凭据安全
#   本步骤不下载数据；CFG 不应包含卫星账户、密码、令牌或 API key。
# =============================================================================

# GAMMA TOPS 参考景几何配置（正式模板）
# 功能用途：用参考日期的 SLC 和 GAMMA DEM 建立后续 TOPS 配准所需的几何产品。
# 输入：SLC、srtm.dem/srtm.dem.par；输出：DEM_geocode 参考几何文件。
# 适用范围：GAMMA Sentinel-1 TOPS；不适用范围：普通条带/radar-grid 与 NISAR GSLC。
# 本阶段不生成 RSLC 或干涉图。上一步：GAMMA TOPS SLC；下一步：GAMMA TOPS coreg。
# 查看帮助：conda run -n envInSAR geodesy-pre-gamma-geo-ref-tops --help
# 正式运行：conda run -n envInSAR geodesy-pre-gamma-geo-ref-tops --config <项目>/config/preprocessing/gamma_geo_ref_tops.cfg --case main
# 结果保存：output_dir。日志：Workflow 写入项目 LOG；直接运行只输出到终端。
# 完成判断：退出码为 0，且 output_dir 中计划的 lookup、height、incidence 等文件完整。
# 重新运行：完整结果 skipped；不完整目录会报错且不覆盖。
# 凭据安全：本步骤不联网，配置中不得填写账号、密码或密钥。
# reference、range_looks、azimuth_looks 必须与 SLC 和 coreg 配置完全一致。

[project]
# 【必填】相对路径基准；配置位于 <项目>/config/preprocessing 时通常为 ../..。
root = ../..

[defaults]
# [defaults] 为所有 case 提供公共值。
# 【常改】GAMMA DEM 所在目录。
dem_dir = DEM
# 【常改】必须与 SLC/coreg 一致的距离向和方位向多视数。
range_looks = 7
azimuth_looks = 2
# 【通常不改】auto 根据 DEM 与雷达网格参数计算过采样。
latitude_oversampling = auto
longitude_oversampling = auto
# 【谨慎修改】参考模式和入射角模式；不了解 GAMMA 参数含义时保持默认。
reference_flag = 1
incidence_flag = 0

[case:main]
# [case:main] 是由 --case main 选择的一组任务。
# 【必填】【常改】YYYYMMDD 参考日期，必须真实存在于 slc_dir。
reference = 20240101
# 【必填】【常改】上一阶段逐景 SLC 根目录。
slc_dir = WORK/GAMMA/SLC_154
# 【必填】【常改】本阶段结果目录。
output_dir = WORK/GAMMA/DEM_geocode_154

# =============================================================================
# OpenTopography DEM 下载及可选 GAMMA 转换
# 功能用途：下载公共 DEM，并默认调用 srtm2dem 生成 GAMMA DEM；
# 适用范围：OpenTopography Global DEM 和 GAMMA 地形准备；
# 不适用范围：SAR 配准和分析。上一步：准备研究区范围；下一步：参考几何。
# 结果保存：统一写入 PROJECT/TOPOGRAPHY/<dataset_id>/{SOURCE,GAMMA}。
# 重新运行：遵循文末重跑规则。
#
# 功能：按 KML 或经纬度范围下载并校验 DEM，可在同一次运行中转换为 GAMMA 格式。
# 输入：研究区 KML，或 west/south/east/north 四个 WGS84 边界值。
# 输出：数据集命名的 GeoTIFF、GAMMA DEM，以及下载、转换和数据集清单。
# 适用：OpenTopography Global DEM API 支持的数据集。
# 不适用：地形相位计算、SAR 配准和干涉分析。
# 边界：本步骤在公共 DEM 下载及可选 GAMMA 格式转换后结束。
#
# 前置步骤：准备研究区 KML；若使用 bbox，则不需要 KML。
# 后续步骤：使用生成的 GAMMA DEM 建立 SAR 参考几何。
# 已有本地 GeoTIFF、无需下载时，仍可单独使用 geodesy-pre-gamma-dem-convert。
#
# 复制模板：
#   cp /path/to/opentopo_dem_download.cfg PROJECT/CONFIG/preprocessing/opentopo_dem_download.cfg
#
# 查看帮助：
#   geodesy-pre-dem --help
#
# 只检查、不下载：
#   geodesy-pre-dem --config PROJECT/CONFIG/preprocessing/opentopo_dem_download.cfg --dry-run
#
# 正式运行：
#   geodesy-pre-dem --config PROJECT/CONFIG/preprocessing/opentopo_dem_download.cfg
#
# 默认会执行 GAMMA 转换；只需要原始 GeoTIFF 时设置 run_srtm2dem=false。
# =============================================================================

# 本模板为无分节 key=value 配置。所有相对路径均以本 CFG 所在目录为基准。

# 【必填】【通常不改】项目根目录。模板位于 PROJECT/config/topography/ 时为 ../..。
project_root = ../..

# 【必填】【常改】地形数据集唯一名称。程序据此创建
# PROJECT/TOPOGRAPHY/area_cop30/SOURCE 和 GAMMA，不再手工拼输出目录。
topography_dataset_id = area_cop30

# 【必填】【常改】类型：kml 或 bbox。选择 bbox 时忽略 kml_file/kml_placemark。
input_mode = kml

# 【必填】【常改】类型：路径。仅 input_mode=kml 时填写；相对 CFG 目录解析。
kml_file = ../../ROI.kml

# 【常改】类型：文字。留空表示合并 KML 中全部几何；填写时必须唯一匹配。
kml_placemark =

# 【必填】【常改】类型：十进制度，WGS84。仅 input_mode=bbox 时填写四项，
# 必须满足 west < east、south < north；经度范围 -180..180，纬度 -90..90。
west =
south =
east =
north =

# 【常改】类型：千米，默认 5。对研究区四周扩展；不能为负数。
buffer_km = 5

# 【常改】类型：OpenTopography 数据集名，默认 COP30。30 m 产品的大区域请求
# 可能超过服务限制；报错时应拆分区域，不要反复重试同一范围。
dem_type = COP30

# 【通常不改】类型：HTTPS URL。必须保持官方主机，防止密钥发往第三方。
api_url = https://portal.opentopography.org/API/globaldem

# 【凭据】【常改】类型：环境变量名。运行前执行
# export OPENTOPO_API_KEY="YOUR_API_KEY"；这里绝不填写真实密钥。
api_key_env = OPENTOPO_API_KEY

# 【通常不改】允许值：GTiff、AAIGrid、HFA。后续 GAMMA 转换必须使用 GTiff。
output_format = GTiff

# 【通常不改】单位：秒。连接和读取超时必须大于 0。
timeout_connect_sec = 30
timeout_read_sec = 600

# 【通常不改】重试次数、退避系数和流式下载块大小（MiB）。
retries = 4
backoff_factor = 2
chunk_mb = 4

# 【通常不改】类型：布尔值。GTiff 下载后检查坐标系、覆盖范围和有效像元。
verify_tiff = true

# 【通常不改】数据集模式必须写出可复现元数据和目录清单。
write_metadata = true

# 【谨慎修改】类型：布尔值，默认 false。true 会替换同名下载结果；命令行
# --force 也会临时允许覆盖。先确认旧结果不再需要。
overwrite = false

# 【常改】记录来源高程基准，仅写入元数据，不会自动执行基准转换。
source_vertical_datum = unspecified

# 【通常不改】配置内 dry-run 开关；通常直接使用命令行 --dry-run。
dry_run = false

# -----------------------------------------------------------------------------
# 下载后的可选 GAMMA 转换
# -----------------------------------------------------------------------------
# 【常改】默认 true：下载后执行 srtm2dem。只需要 GeoTIFF 时改为 false。
run_srtm2dem = true

# 【通常不改】GAMMA 命令名。输出名和目录由 topography_dataset_id 唯一确定。
srtm2dem_command = srtm2dem

# 【谨慎修改】高程基准处理参数。flag=2 时必须提供 geoid 文件。
srtm2dem_geoid_correction_flag = 0
srtm2dem_geoid_file =
srtm2dem_gdal_bin_dir =

# =============================================================================
# 结果和日志
#   结果：../../TOPOGRAPHY/area_cop30/SOURCE/area_cop30.tif 与
#         ../../TOPOGRAPHY/area_cop30/GAMMA/area_cop30.dem(.par)。
#   清单：SOURCE/download_manifest.json、GAMMA/conversion_manifest.json、
#         topography_manifest.json 和 TOPOGRAPHY/catalog.json。
#   日志：本命令输出到终端；Workflow 调用时写入项目 LOG/PRE/COMMON。
#
# 完成判断
#   1. GeoTIFF 和元数据存在；
#   2. run_srtm2dem=true 时 GAMMA DEM、参数和日志均存在并通过尺寸校验；
#   3. 终端没有 ERROR。
#
# 重跑规则
#   - 已有 GeoTIFF 会校验后复用，不再次联网；
#   - 完整 GAMMA 结果会校验后跳过，残缺结果会报错；
#   - 下载使用同目录临时文件，失败不会发布半成品；
#   - 明确确认后才使用 --force 或 overwrite=true。
#
# 常见问题
#   1. API key not found：检查环境变量名和当前终端是否已 export。
#   2. request limit：缩小或拆分 KML/bbox。
#   3. CRS/coverage 错误：检查服务响应和研究区经纬度顺序。
#   4. srtm2dem command not found：确认已激活配置好 GAMMA 的环境。
#
# 凭据安全
#   密钥只从环境变量读取；不要把真实密钥写进 CFG、日志或 Git。
# =============================================================================

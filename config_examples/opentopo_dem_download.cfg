# =============================================================================
# OpenTopography DEM 下载（公共获取步骤）
# 功能用途：下载公共 DEM；适用范围：OpenTopography Global DEM；
# 不适用范围：GAMMA 转换和 SAR 处理。上一步：准备研究区范围；
# 下一步：按需执行 GAMMA DEM 转换。结果保存：由 output_dir/output_name 指定。
# 重新运行：遵循文末重跑规则。
#
# 功能：按 KML 或经纬度范围从 OpenTopography 下载并校验一份 DEM。
# 输入：研究区 KML，或 west/south/east/north 四个 WGS84 边界值。
# 输出：GeoTIFF 等 OpenTopography 原始输出，以及不含密钥的 JSON 元数据。
# 适用：OpenTopography Global DEM API 支持的数据集。
# 不适用：GAMMA DEM 转换、地形相位计算、SAR 配准和干涉分析。
# 边界：本步骤在公共 DEM 下载并校验后结束，不调用 GAMMA。
#
# 前置步骤：准备研究区 KML；若使用 bbox，则不需要 KML。
# 后续步骤：如需 GAMMA 格式，复制 gamma_dem_convert.cfg 并运行
#           geodesy-pre-gamma-dem-convert。
#
# 复制模板：
#   cp /path/to/opentopo_dem_download.cfg PROJECT/CONFIG/preprocessing/opentopo_dem_download.cfg
#
# 查看帮助：
#   geodesy-pre-dem --help
#
# 只检查、不下载：
#   geodesy-pre-dem --config PROJECT/CONFIG/preprocessing/opentopo_dem_download.cfg --dry-run
#
# 正式运行：
#   geodesy-pre-dem --config PROJECT/CONFIG/preprocessing/opentopo_dem_download.cfg
#
# 兼容说明：旧项目 CFG 中的 run_srtm2dem 和 srtm2dem_* 参数仍可读取，
#           但新项目应使用独立的 gamma_dem_convert.cfg。
# =============================================================================

# 本模板为无分节 key=value 配置。所有相对路径均以本 CFG 所在目录为基准。

# 【必填】【常改】类型：kml 或 bbox。选择 bbox 时忽略 kml_file/kml_placemark。
input_mode = kml

# 【必填】【常改】类型：路径。仅 input_mode=kml 时填写；相对 CFG 目录解析。
kml_file = ../../INPUT/area.kml

# 【常改】类型：文字。留空表示合并 KML 中全部几何；填写时必须唯一匹配。
kml_placemark =

# 【必填】【常改】类型：十进制度，WGS84。仅 input_mode=bbox 时填写四项，
# 必须满足 west < east、south < north；经度范围 -180..180，纬度 -90..90。
west =
south =
east =
north =

# 【常改】类型：千米，默认 5。对研究区四周扩展；不能为负数。
buffer_km = 5

# 【常改】类型：OpenTopography 数据集名，默认 COP30。30 m 产品的大区域请求
# 可能超过服务限制；报错时应拆分区域，不要反复重试同一范围。
dem_type = COP30

# 【通常不改】类型：HTTPS URL。必须保持官方主机，防止密钥发往第三方。
api_url = https://portal.opentopography.org/API/globaldem

# 【凭据】【常改】类型：环境变量名。运行前执行
# export OPENTOPO_API_KEY="YOUR_API_KEY"；这里绝不填写真实密钥。
api_key_env = OPENTOPO_API_KEY

# 【通常不改】允许值：GTiff、AAIGrid、HFA。后续 GAMMA 转换必须使用 GTiff。
output_format = GTiff

# 【通常不改】单位：秒。连接和读取超时必须大于 0。
timeout_connect_sec = 30
timeout_read_sec = 600

# 【通常不改】重试次数、退避系数和流式下载块大小（MiB）。
retries = 4
backoff_factor = 2
chunk_mb = 4

# 【通常不改】类型：布尔值。GTiff 下载后检查坐标系、覆盖范围和有效像元。
verify_tiff = true

# 【必填】【常改】类型：路径。相对 CFG 目录；建议指向项目 INPUT/DEM。
output_dir = ../../INPUT/DEM

# 【常改】类型：文件名。应与 output_format 一致，供后续转换 CFG 引用。
output_name = dem.tif

# 【通常不改】写出可复现元数据；metadata_name 留空时使用默认文件名。
write_metadata = true
metadata_name = dem.tif.json

# 【谨慎修改】类型：布尔值，默认 false。true 会替换同名下载结果；命令行
# --force 也会临时允许覆盖。先确认旧结果不再需要。
overwrite = false

# 【常改】记录来源高程基准，仅写入元数据，不会自动执行基准转换。
source_vertical_datum = unspecified

# 【通常不改】配置内 dry-run 开关；通常直接使用命令行 --dry-run。
dry_run = false

# =============================================================================
# 结果和日志
#   结果：<CFG目录>/../../INPUT/DEM/dem.tif 和 dem.tif.json。
#   日志：本命令输出到终端；Workflow 调用时写入项目 LOG/PRE/COMMON。
#
# 完成判断
#   1. DEM 文件存在且大小大于 0；
#   2. 元数据 JSON 存在，包含请求范围、摘要和栅格信息；
#   3. 终端显示“下载完成”，且没有 ERROR。
#
# 重跑规则
#   - 默认不覆盖完整结果；
#   - 下载使用同目录临时文件，失败不会发布半成品；
#   - 明确确认后才使用 --force 或 overwrite=true。
#
# 常见问题
#   1. API key not found：检查环境变量名和当前终端是否已 export。
#   2. request limit：缩小或拆分 KML/bbox。
#   3. CRS/coverage 错误：检查服务响应和研究区经纬度顺序。
#
# 凭据安全
#   密钥只从环境变量读取；不要把真实密钥写进 CFG、日志或 Git。
# =============================================================================

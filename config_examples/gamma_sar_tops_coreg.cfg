# GAMMA TOPS 全栈配准配置（正式模板）
# 功能用途：以 reference 为主影像，把同轨 TOPS SLC 配准并发布完整 RSLC 栈。
# 输入：SLC、参考几何和影像清单；输出：RSLC、质量记录及辅助材料。
# 适用范围：GAMMA Sentinel-1 TOPS；不适用范围：普通 radar-grid 与 NISAR GSLC。
# 本阶段不生成干涉图。上一步：GAMMA TOPS geo-ref；下一步：Analysis 干涉处理。
# 查看帮助：conda run -n envInSAR geodesy-pre-gamma-sar-tops-coreg --help
# 正式运行：conda run -n envInSAR geodesy-pre-gamma-sar-tops-coreg --config <项目>/S1/ASCENDING_154/config/preprocessing/gamma_sar_tops_coreg.cfg --case main
# 结果保存：output_dir/RSLC；质量在 output_dir/coreg_quality。
# 日志：Workflow 写入项目 LOG；直接运行只输出到终端。
# 完成判断：退出码为 0，每个日期都有 .rslc/.rslc.par，且质量摘要存在。
# 重新运行：完整栈 skipped；不完整目录会报错且不覆盖。
# 凭据安全：本步骤不联网，配置中不得填写账号、密码或密钥。
# reference、range_looks、azimuth_looks 必须与 SLC 和 geo-ref 配置完全一致。

[project]
# 【必填】相对路径基准。
root = ../../../..

[defaults]
# [defaults] 为所有 case 提供公共值。
# 【常改】必须与 SLC/geo-ref 一致的多视数。
range_looks = 7
azimuth_looks = 2
# 【谨慎修改】配准质量阈值；没有明确实验依据时保持默认。
coherence_threshold = 0.8
fraction_threshold = 0.01
phase_stdev_threshold = 0.8
# 【通常不改】标识、拟合阶数和桥接策略。
id_mode = date
npoly = 4
bridge_mode = none

[case:main]
# [case:main] 是由 --case main 选择的一组任务。
# 【必填】项目相对 case 根；声明后拒绝旧 WORK/GAMMA 输出。
case_root = S1/ASCENDING_154
# 【必填】【常改】上一阶段逐景 SLC 根目录。
slc_dir = S1/ASCENDING_154/PRE/GAMMA/SLC
# 【必填】【常改】geo-ref 的 output_dir。
dem_geocode_dir = S1/ASCENDING_154/PRE/GAMMA/GEOMETRY
# 【必填】【常改】完整 RSLC 栈输出目录。
output_dir = S1/ASCENDING_154/PRE/GAMMA/RSLC
# 【必填】【常改】YYYYMMDD 参考日期。
reference = 20240101
# 【必填】【通常不改】日期清单，一行一个 YYYYMMDD。
images = S1/QUERY/ascending/images_154

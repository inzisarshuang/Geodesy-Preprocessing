# =============================================================================
# 功能用途
# =============================================================================
# 查询 Sentinel-1 产品、绘制轨道覆盖图、按人工确认结果安全下载，并在 BURST 模式下
# 合并为 GAMMA TOPS SLC 可读取的 SAFE。正式任务名：
# PRE_COMMON_SENTINEL1_ACQUISITION。
#
# 适用范围
# - BURST、SLC、GRD 三种 ASF Sentinel-1 产品；
# - KML 或 bbox 研究区；自动/手动轨道和升降轨；
# - BURST 下载后用 burst2safe 合并为 SAFE。
#
# 不适用范围
# - 本命令不生成 GAMMA SLC、参考几何、RSLC、干涉图或形变结果；
# - GRD 不进入当前 InSAR TOPS 链；SLC/GRD 不需要 --merge。
#
# 上一步：准备项目 KML，确认 Earthdata 的 ~/.netrc 或运行时环境变量。
# 下一步：BURST 依次执行 --query、--download、--merge；然后运行
# gamma_sar_tops_slc.cfg。SLC 下载完成后可直接进入 TOPS SLC。
#
# 查看帮助：
#   geodesy-pre-sar-sentinel1-acquire --help
#
# 正式运行：
#   geodesy-pre-sar-sentinel1-acquire --config PROJECT/config/preprocessing/sentinel1_download.cfg --case main --query
#   geodesy-pre-sar-sentinel1-acquire --config PROJECT/config/preprocessing/sentinel1_download.cfg --case main --download
#   geodesy-pre-sar-sentinel1-acquire --config PROJECT/config/preprocessing/sentinel1_download.cfg --case main --merge
#
# 结果保存
# - query_dir：查询 CSV、覆盖图、下载链接、images_NNN、query_manifest.json；
# - download_dir/Orbit_NNN：下载文件和已验证 SAFE；
# - download_dir/source_manifest.json、download_dir/safe_manifest.json：来源与合并清单。
#
# 日志
# 直接运行在终端显示统一逐文件进度；Workflow 完整日志位于
# PROJECT/LOG/PRE/COMMON/SENTINEL1_ACQUISITION/。
#
# 完成判断
# query_manifest.json 必须为当前 CFG/KML；download 后 source_manifest.json 全部产品状态
# 为 downloaded 或 existing；BURST merge 后 safe_manifest.json 包含该分组，且 SAFE
# 内 manifest.safe、annotation 和 measurement 均存在。
#
# 重新运行
# 相同输入安全跳过。修改日期、研究区、产品类型、极化、方向或轨道后必须重新
# --query；旧指纹不会继续下载。残缺或来源不一致的正式 SAFE 不会被自动覆盖。
#
# 凭据安全
# CFG 不填写用户名、password、token、Cookie 或 API key。按优先级使用：
# 1. export EARTHDATA_TOKEN="临时令牌"；
# 2. EARTHDATA_USERNAME 与 EARTHDATA_PASSWORD；
# 3. ~/.netrc 中 machine urs.earthdata.nasa.gov。
# =============================================================================

[project]
# 【必填】项目根目录；相对路径按本 CFG 所在目录解析。
root = ../..

[defaults]
# 【通常不改】当前唯一提供方。
provider = asf

# 【常改】BURST、SLC 或 GRD。InSAR 建议 BURST；也可直接下载完整 SLC。
product_type = BURST

# 【常改】BURST 支持 IW/EW；SLC/GRD 还支持 S1-S6/WV。
beam_mode = IW

# 【常改】HH、HV、VH、VV，可用逗号分隔；auto 表示不限制。
polarizations = VV

# 【常改】auto 或逗号分隔相对轨道，例如 154 或 1,74,154。
tracks = auto

# 【常改】auto、ascending 或 descending。
orbit_direction = auto

# 【谨慎修改】研究区最低联合覆盖率，范围 (0,1]。
coverage_threshold = 0.999

# 【谨慎修改】并行下载数 1-32、单文件重试数 0-20、重试间隔秒数。
download_threads = 2
max_retries = 3
retry_delay_seconds = 10

# 【通常不改】SAFE 验证成功后是否保留本任务下载的 BURST 文件。
keep_burst_files = true

[case:main]
# 【必填】KML 与 bbox 二选一；路径必须位于项目根目录内。
kml_file = S1/ROI.kml
# bbox = -5.4,39.6,-3.8,41.1

# 【常改】查询日期，YYYY-MM-DD；结束日期不得早于开始日期。
start_date = 2026-09-01
end_date = 2026-09-30

# 【通常不改】项目内查询审查目录和下载根目录。
query_dir = S1/QUERY/ascending
download_dir = S1/DOWNLOAD/ascending

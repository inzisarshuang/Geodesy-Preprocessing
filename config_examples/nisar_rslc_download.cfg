# =============================================================================
# NISAR L1 RSLC 查询、覆盖审查与下载（公共获取步骤）
#
# 功能用途
#   根据项目 KML 和日期查询 ASF/Earthdata 上的 NISAR L1 RSLC，生成与 Sentinel-1
#   相近的轨道/帧覆盖图和表格。由人检查后，再下载选定的 HDF5 原始产品。
#
# 适用范围
#   NISAR L1 RSLC；默认 L 波段 Frequency A（LA）。需要后续电离层准备时，可显式
#   选择 main_plus_auxiliary，同时要求 Frequency A 和 B 均存在。
#
# 不适用范围
#   本命令不调用 GAMMA，不生成 SLC/RSLC，不配准、不裁剪，也不生成干涉图或执行
#   电离层改正。NISAR L0B 聚焦、GSLC 和派生产品也不在此模板范围内。
#
# 上一步
#   准备项目目录和 WGS84 Polygon/MultiPolygon KML。
#
# 下一步
#   下载完成后，用 gamma_sar_slc.cfg 的 nisar_la（可选 nisar_lb）case 调用
#   geodesy-pre-gamma-sar-slc，将 HDF5 导入 GAMMA。
#
# Workflow 任务名
#   PRE_COMMON_NISAR_ACQUISITION
#
# 复制模板
#   cp /path/to/nisar_rslc_download.cfg PROJECT/CONFIG/preprocessing/nisar_rslc_download.cfg
#
# 查看帮助
#   geodesy-pre-sar-nisar-acquire --help
#
# 第一次查询（只查元数据，不下载、不读取凭据）
#   geodesy-pre-sar-nisar-acquire --config PROJECT/CONFIG/preprocessing/nisar_rslc_download.cfg --case main --query
#
# 正式运行：人工查看 PNG/CSV，把 tracks 和 frames 从 auto 改为选定值，再查询一次
#   geodesy-pre-sar-nisar-acquire --config PROJECT/CONFIG/preprocessing/nisar_rslc_download.cfg --case main --query
#
# 正式运行：确认最终筛选表后下载
#   geodesy-pre-sar-nisar-acquire --config PROJECT/CONFIG/preprocessing/nisar_rslc_download.cfg --case main --download
# =============================================================================

[project]
# 【必填】【常改】项目根目录。建议写绝对路径；本 CFG 的所有数据路径必须位于根目录内。
root = /absolute/path/to/PROJECT

[defaults]
# 【通常不改】本链当前只接受 NISAR L1 RSLC。
product_type = RSLC

# 【通常不改】当前正式获取链为 L 波段；S 波段适配留给后续扩展。
band = L

# 【通常不改】当前查询提供商为 Alaska Satellite Facility。
provider = asf

# 【常改】main_only：只要求 Frequency A；main_plus_auxiliary：同时要求 A 和 B。
# 普通形变预处理使用 main_only；只有明确准备双频电离层分析时才选择后者。
frequency_mode = main_only

# 【常改】第一次保持 auto；查看覆盖图后填写逗号分隔的正整数，如 87。
# 进入 GAMMA 导入的最终 case 只保留一条轨道；多轨道请建立多个 case 和下载目录。
tracks = auto

# 【常改】第一次保持 auto；查看覆盖图后填写逗号分隔的正整数，如 22,23。
# 覆盖审查可查看多帧，但当前 GAMMA 注册栈必须一条轨道、一帧；最终下载时每个
# case 填一个 frame，并为不同帧设置不同 download_dir。
frames = auto

# 【常改】auto、ascending 或 descending。auto 表示不按升降轨过滤。
orbit_direction = auto

# 【通常不改】查询审查结果目录和原始 HDF5 下载目录，均相对项目根目录。
query_dir = INPUT/NISAR/QUERY
download_dir = INPUT/NISAR/RSLC

[case:main]
# 【必填】【常改】WGS84 研究区 KML；必须位于项目根目录内。
kml_file = INPUT/ROI/area.kml

# 【必填】【常改】查询起止日期，格式 YYYY-MM-DD，包含边界日期。
start_date = 2026-01-01
end_date = 2026-12-31

# 【必填】【常改】需要的极化，使用 HH、HV、VH、VV，多个值以逗号分隔。
# 只需要单极化时可写 HH；不能把频率 A/B 写在这里。
polarizations = HH

# 【谨慎修改】以下参数可覆盖 defaults。通常只在同一项目设置多个 case 时使用。
# frequency_mode = main_plus_auxiliary
# tracks = 87
# frames = 22,23
# orbit_direction = descending

# =============================================================================
# 结果保存
#   INPUT/NISAR/QUERY/NISAR_RSLC_footprints_all.png       全部覆盖图
#   INPUT/NISAR/QUERY/NISAR_RSLC_footprints_selected.png  筛选覆盖图
#   INPUT/NISAR/QUERY/NISAR_RSLC_all.csv                  全部规范化结果
#   INPUT/NISAR/QUERY/NISAR_RSLC_track_coverage.csv       逐轨联合覆盖率
#   INPUT/NISAR/QUERY/NISAR_RSLC_filtered.csv             最终下载选择
#   INPUT/NISAR/QUERY/NISAR_RSLC_download_urls_trackNNN.txt
#   INPUT/NISAR/QUERY/query_manifest.json                 KML/参数/文件摘要
#   INPUT/NISAR/RSLC/*.h5                                 已校验原始产品
#   INPUT/NISAR/RSLC/source_manifest.json                 下载来源与校验记录
#
# 日志
#   直接运行：进度和错误显示在当前终端。
#   Workflow：任务 PRE_COMMON_NISAR_ACQUISITION 写入
#             PROJECT/LOG/PRE/COMMON/NISAR_ACQUISITION。
#
# 完成判断
#   查询完成：两张 PNG、三个 CSV、query_manifest.json 均存在；人工确认红色研究区和
#             选中轨道/帧合理，NISAR_RSLC_filtered.csv 内容符合预期。
#   下载完成：每个筛选产品都有正式 .h5、没有遗留同名 .part，source_manifest.json
#             中状态为 downloaded 或 existing，命令退出码为 0。
#
# 重新运行
#   查询会以完整目录事务替换旧查询产物，不会下载数据。
#   下载可从同目录 .part 续传；服务器不支持 Range 时会安全重下。完整且校验通过的
#   .h5 会复用；残缺或不一致的正式 .h5 不会被静默覆盖。
#
# 常见失败
#   - stale query fingerprint：KML、日期、轨道、帧、频率、极化或筛选 CSV 已改变；
#     重新执行 --query，检查结果后再执行 --download。
#   - Earthdata authentication failed：检查 .netrc 权限或当前终端环境变量。
#   - checksum/size/HDF5 mismatch：不要手工改名 .part；检查网络和产品来源后重试。
#   - 没有筛选结果：放宽日期/轨道/帧，或确认所选极化与 Frequency B 是否可用。
#
# 凭据安全
#   CFG 中严禁填写用户名、密码、Cookie、API key 或 token。下载时按以下顺序任选一种：
#   1. 标准 ~/.netrc（machine urs.earthdata.nasa.gov）；
#   2. export EARTHDATA_TOKEN="临时令牌"；
#   3. export EARTHDATA_USERNAME="用户名" 和 EARTHDATA_PASSWORD="密码"。
#   查询不读取凭据；URL 查询参数、Authorization 和密码不会写入日志、CSV 或 JSON。
# =============================================================================

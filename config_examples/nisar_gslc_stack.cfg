# =============================================================================
# NISAR L2 GSLC 地理网格复数栈准备（Native，不使用 GAMMA）
#
# 功能用途
#   读取已下载并校验的 GSLC HDF5，检查所有日期是否属于同一轨道、帧、方向和
#   完全一致的地图网格；按项目 KML 外扩缓冲区，规划并生成 complex64 裁剪栈。
#
# 适用范围
#   NISAR L2 GSLC。LA 与 LB 分开配置、分开输出；极化可按项目需要选择。
#
# 不适用范围
#   不生成 RSLC、不调用 GAMMA、不重投影或重采样复数相位；不进行干涉、相干性、
#   解缠、形变分析。GUNW 相干性 TIFF 不是本命令的输入。
#
# 上一步
#   使用 nisar_gslc_download.cfg 完成 --query 和 --download，确认 source_manifest.json。
#
# 下一步
#   将 registered_stack.json 交给 Geodesy-Analysis 的干涉或时序模块。
#
# Workflow 任务名
#   PRE_NISAR_GSLC
#
# 复制模板
#   cp /path/to/nisar_gslc_stack.cfg PROJECT/CONFIG/preprocessing/nisar_gslc_stack.cfg
#
# 查看帮助
#   geodesy-pre-sar-nisar-gslc --help
#
# 首先只检查和显示计划
#   geodesy-pre-sar-nisar-gslc --config PROJECT/CONFIG/preprocessing/nisar_gslc_stack.cfg --case la --plan-only
#
# 正式运行
#   geodesy-pre-sar-nisar-gslc --config PROJECT/CONFIG/preprocessing/nisar_gslc_stack.cfg --case la
# =============================================================================

[project]
# 【必填】【常改】项目根目录；所有输入输出必须位于这里。
root = /absolute/path/to/PROJECT

[defaults]
# 【必填】【通常不改】下载步骤发布的无凭据来源清单。
source_manifest = INPUT/NISAR/GSLC/source_manifest.json
# 【必填】【常改】WGS84 Polygon/MultiPolygon KML。
kml_file = INPUT/ROI/area.kml
# 【谨慎修改】KML 有多个 Placemark 时可填写名称；空值表示合并全部多边形。
kml_placemark =
# 【必填】【常改】研究区向外扩大的公里数；必须有限且不小于 0。
buffer_km = 5
# 【必填】【通常不改】NISAR 雷达波段；正式 NASA GSLC 通常为 L。
band = L
# 【必填】【常改】输出极化；多个值用逗号分隔，不可重复。
polarizations = HH
# 【必填】【常改】参考日期，格式 YYYYMMDD，必须实际存在于来源产品中。
reference_date = 20260831

[case:la]
# 【必填】【通常不改】一个 case 只能有一个频率：A 或 B。
frequency = A
# 【必填】【常改】LA 的独立输出目录，不能放在原始 HDF5 目录内。
output_dir = WORK/NISAR/GSLC/LA/STACK

[case:lb]
# 【谨慎修改】只有下载产品确实包含 Frequency B 时才运行此 case。
frequency = B
# 【常改】LB 可选择与 LA 不同的极化，但每个日期必须完整具备。
polarizations = HH
# 【必填】【常改】LB 必须使用独立输出目录。
output_dir = WORK/NISAR/GSLC/LB/STACK

# =============================================================================
# 结果保存
#   WORK/NISAR/GSLC/LA/STACK/registered_stack.json
#   WORK/NISAR/GSLC/LA/STACK/complex/<POL>/<DATE>/<DATE>.tif
#   WORK/NISAR/GSLC/LA/STACK/metadata、quicklooks、crop_window.json、quality.json
#
# 日志
#   终端只显示统一逐景进度；详细日志写入 PROJECT/LOG/PRE/NISAR/GSLC。
#
# 完成判断
#   输出目录存在 registered_stack.json、crop_window.json、quality.json，且日期 × 极化
#   数量与 source_manifest.json 一致；原始 HDF5 摘要不变。
#
# 重新运行
#   输入与配置摘要完全相同时安全复用；任何网格或配置变化会停止，不覆盖旧成果。
#
# 常见失败
#   - grid mismatch：不同日期 CRS、间距、原点或形状不同，不会自动重采样。
#   - buffered AOI outside scene：缓冲研究区未被每景完整覆盖，应调整数据或缓冲区。
#   - missing polarization：某个日期缺少所选频率/极化，不能发布不完整栈。
#
# 凭据安全
#   本 CFG 不填写用户名、password、token、Cookie 或 API key。它只读取已经下载的
#   本地 HDF5 和不含凭据的 source_manifest.json。
# =============================================================================

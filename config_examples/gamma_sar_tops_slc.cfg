# GAMMA Sentinel-1 TOPS SLC 生成配置（正式模板）
#
# 功能用途
# --------
# 使用 GAMMA 把 Sentinel-1 TOPS 原始 ZIP 或已整理的 SAFE 数据生成逐景 SLC、
# MLI、参数文件和预览图。正式入口明确标出 GAMMA 后端，便于未来与 ISCE 等
# 实现并存；下载、SLC 生成、配准仍是彼此独立的预处理阶段。
#
# 适用范围：Sentinel-1 TOPS，输入为传统完整 ZIP 或 burst 拼接后的 .SAFE。
# 不适用范围：NISAR、ALOS 等雷达网格产品；它们使用各自的导入入口。
# 处理边界：本步骤只生成 SLC，不负责后续几何配准或干涉分析。
# 上一步：下载并整理原始数据、轨道文件、影像清单和参考 burst 表。
# 下一步：执行 GAMMA 几何参考与配准，生成 RSLC。
#
# 使用方法（在 envInSAR 中）
# ---------------------------
# 1. 查看帮助：
#    conda run -n envInSAR geodesy-pre-gamma-sar-tops-slc --help
# 2. 把本文件复制到研究项目的 S1/ASCENDING_154/config/preprocessing/。
# 3. 当前命令没有单独的 dry-run；正式运行前先核对下面四条输入路径，并可先用
#    --help 确认命令入口。
# 4. 正式运行：
#    conda run -n envInSAR geodesy-pre-gamma-sar-tops-slc \
#      --config <项目>/S1/ASCENDING_154/config/preprocessing/gamma_sar_tops_slc.cfg --case main
#
# 结果保存：每景结果位于 slc_dir/<影像标识>/，包括 *.SLC_tab、*.mli、
# *.mli.par 和 *.mli.bmp。
# 日志：由 Geodesy-Workflow 调用时自动写入项目 LOG；直接运行本命令时，统一
# 进度和错误显示在当前终端，不会自行创建项目 LOG。
# 完成判断：命令退出码为 0，并且每景目录中同时存在上述四类文件。
# 重新运行：已经存在目标 *.mli 的景会显示 skipped；如果目标目录非空却缺少
# *.mli，程序会停止，先查看错误并人工确认残留目录，避免覆盖半成品。
# 凭据安全：此步骤不需要账号、密码或 API key，禁止把凭据写入本文件。

[project]
# 【必填】所有相对路径的共同基准。配置位于 case/config/preprocessing，
# 因此用 ../../../.. 返回研究项目根目录。
root = ../../../..

[defaults]
# [defaults] 保存多个 case 共用的参数；case 内同名参数会覆盖这里的值。
# 【常改】精密轨道目录；SAFE 自带信息且无需单独指定时填写 -。
opod_dir = -
# 【常改】距离向/方位向多视数。应根据分辨率和后续处理目标选择正整数。
range_looks = 7
azimuth_looks = 2
# 【常改】极化；- 使用默认 vv，也可填 vh、hh 或 hv。必须与原始数据一致。
polarization = -
# 【谨慎修改】safe 读取 .SAFE 目录；zip 读取传统完整 .zip，二者不可混用。
workflow = safe

[case:main]
# [case:main] 是名为 main 的一组任务；可增加 [case:orbit074] 等并用 --case 选择。
# 以下路径都相对于 [project] root，也允许写绝对路径。
# 【必填】项目相对的 <传感器>/<CASE>；启用 PRE/GAMMA 输出边界。
case_root = S1/ASCENDING_154
# 【必填】【常改】原始 ZIP 文件或 SAFE 目录所在位置。
raw_dir = RAW/Orbit_154
# 【必填】【常改】逐景结果根目录；不要与 raw_dir 写成同一目录。
slc_dir = S1/ASCENDING_154/PRE/GAMMA/SLC
# 【必填】【常改】待处理影像清单，一行一个安全影像标识。
images = S1/QUERY/ascending/images_154
# 【必填】【通常不改】参考 burst 选择表；内容必须对应本轨道和研究区。
burst_table = S1/ASCENDING_154/PRE/ref_burst_number_table_154

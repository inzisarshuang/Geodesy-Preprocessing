# PATH CONTRACT / 处理链路径契约
# STEP / 步骤：ACQUISITION · NISAR GSLC download
# RUN / 运行：geodesy-pre-sar-nisar-acquire --config PROJECT/config/download/nisar_gslc_download.cfg --case main --query
# 查询后用 --download 下载。
# ROOT / 根目录：[project] root 是研究项目根目录；本步骤不创建处理方法目录。
# INPUTS / 输入：ROI、轨道/帧/日期条件与运行时 Earthdata 凭据。
# OUTPUTS / 输出：NISAR/QUERY 与 NISAR/DOWNLOAD 下的只读 GSLC。
# DOWNSTREAM / 下游：NISAR GSLC stack/adaptor 从下载清单读取产品。
# RERUN / 重跑：查询更新审查结果；下载可复用已验证原件，来源冲突须重新查询或核对。

# =============================================================================
# NISAR L2 GSLC 查询、覆盖审查与下载（公共获取步骤）
#
# 功能用途
#   根据项目 KML 和日期查询 ASF/Earthdata 上的 NISAR L2 GSLC，生成轨道/帧
#   覆盖图和表格。由人检查后，下载选定的 HDF5 科学产品。
#
# 适用范围
#   NISAR L2 GSLC；默认 L 波段 Frequency A（LA）。需要后续双频分析准备时，
#   可显式选择 main_plus_auxiliary，同时要求 Frequency A 和 B。
#
# 不适用范围
#   本命令不调用 GAMMA，不生成 RSLC，不做复数重采样，不生成干涉图、
#   相干性、解缠或形变结果。RIFG、RUNW、GUNW、GCOV 也不在此模板范围内。
#
# 上一步
#   准备项目目录和 WGS84 Polygon/MultiPolygon KML。
#
# 下一步
#   下载完成后，用 nisar_gslc_stack.cfg 和 geodesy-pre-sar-nisar-gslc 检查网格、
#   按 KML 缓冲区裁剪并发布地理网格复数栈。
#
# Workflow 任务名
#   PRE_COMMON_NISAR_ACQUISITION
#
# 复制模板
#   cp /path/to/nisar_gslc_download.cfg PROJECT/config/download/nisar_gslc_download.cfg
#
# 查看帮助
#   geodesy-pre-sar-nisar-acquire --help
#
# 第一次查询（只查元数据，不下载、不读取凭据）
#   geodesy-pre-sar-nisar-acquire --config PROJECT/config/download/nisar_gslc_download.cfg --case main --query
#
# 正式运行：检查 PNG/CSV，把 tracks 和 frames 改为选定值，重新查询后下载
#   geodesy-pre-sar-nisar-acquire --config PROJECT/config/download/nisar_gslc_download.cfg --case main --query
#   geodesy-pre-sar-nisar-acquire --config PROJECT/config/download/nisar_gslc_download.cfg --case main --download
# =============================================================================

[project]
# 此项必须填写。项目根目录；本 CFG 中的数据路径必须位于该目录内。
root = /absolute/path/to/PROJECT

[defaults]
# 下面的选项和极化值均不区分大小写。
# 可选 RSLC（省略时采用，L1 雷达网格）或 GSLC（L2 地理网格）。
# 本模板配置 GSLC；切换产品时同时修改 query_dir 和 download_dir。
product_type = GSLC
# 可填 L（默认）或 S。此值写入配置指纹；当前 ASF 查询不会按波段过滤。
band = L
# 唯一选项及默认值为 asf（Alaska Satellite Facility）。
provider = asf
# main_only（默认）只要求 A。main_plus_auxiliary 同时要求 A 和 B。
frequency_mode = main_only
# 可填 auto（默认，不筛选）或逗号分隔的不重复正整数。正式下载时一个 case 只保留一条轨道。
tracks = auto
# 可填 auto（默认，不筛选）或逗号分隔的不重复正整数。正式 stack 一个 case 只保留一帧。
frames = auto
# 可选 auto（默认，不筛选升降轨）、ascending（升轨）或 descending（降轨）。
orbit_direction = auto
# 查询成果与原始只读 HDF5 目录。
query_dir = NISAR/QUERY/GSLC
download_dir = NISAR/DOWNLOAD/GSLC

[case:main]
# 此项必须填写。WGS84 研究区 KML。
kml_file = INPUT/ROI/area.kml
# 此项必须填写。查询起止日期，包含边界日期。
start_date = 2026-01-01
end_date = 2026-12-31
# 此项必须填写。可选 HH、HV、VH、VV，多个值用逗号分隔且不可重复。
polarizations = HH
# 确认覆盖图后可使用下列示例覆盖 [defaults]，允许值同上。
# tracks = 87
# frames = 22
# orbit_direction = ascending
# frequency_mode = main_plus_auxiliary

# =============================================================================
# 结果保存
#   NISAR/QUERY/GSLC/NISAR_GSLC_footprints_all.png
#   NISAR/QUERY/GSLC/NISAR_GSLC_footprints_selected.png
#   NISAR/QUERY/GSLC/NISAR_GSLC_all.csv
#   NISAR/QUERY/GSLC/NISAR_GSLC_track_coverage.csv
#   NISAR/QUERY/GSLC/NISAR_GSLC_filtered.csv
#   NISAR/QUERY/GSLC/NISAR_GSLC_download_urls_trackNNN.txt
#   NISAR/QUERY/GSLC/query_manifest.json
#   NISAR/DOWNLOAD/GSLC/*.h5
#   NISAR/DOWNLOAD/GSLC/source_manifest.json
#
# 日志
#   直接运行时进度显示在终端；Workflow 任务 PRE_COMMON_NISAR_ACQUISITION 写入
#   PROJECT/LOG/PRE/COMMON/NISAR_ACQUISITION。
#
# 完成判断
#   查询完成：两张 PNG、CSV 和 query_manifest.json 完整，人工确认覆盖后再下载。
#   下载完成：每个选中产品都有 .h5，无 .part，source_manifest.json 为完成状态。
#
# 重新运行
#   查询事务替换旧查询产物；下载可从 .part 续传，完整且校验通过的 HDF5 会复用。
#
# 常见失败
#   - stale query fingerprint：KML 或筛选参数已变，必须重新 --query。
#   - Earthdata authentication failed：检查 .netrc 或当前终端环境变量。
#   - HDF5 identity mismatch：下载文件不是查询选中的 GSLC 科学产品。
#
# 凭据安全
#   CFG 中严禁填写用户名、密码、Cookie、API key 或 token。下载时仅使用：
#   1. ~/.netrc（machine urs.earthdata.nasa.gov）；
#   2. EARTHDATA_TOKEN；
#   3. EARTHDATA_USERNAME 和 EARTHDATA_PASSWORD 运行时环境变量。
# =============================================================================

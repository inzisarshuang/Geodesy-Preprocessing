# PATH CONTRACT / 处理链路径契约
# STEP / 步骤：ACQUISITION · Sentinel-1 download
# RUN / 运行：geodesy-pre-sar-sentinel1-acquire --config PROJECT/config/download/sentinel1_download.cfg --case main --query
# 查询后用 --download 下载；仅 BURST 需要 --merge。
# ROOT / 根目录：[project] root 是研究项目根目录；本步骤不创建方法根目录。
# INPUTS / 输入：ROI、查询条件和运行时 Earthdata 凭据。
# OUTPUTS / 输出：S1/QUERY 与 S1/DOWNLOAD；科学处理目录保持不变。
# DOWNSTREAM / 下游：PRE 的 GAMMA TOPS SLC 从 DOWNLOAD 读取 SAFE。
# RERUN / 重跑：查询更新审查结果；下载可复用已验证原件，来源冲突须重新查询或核对。

# =============================================================================
# 功能用途
# =============================================================================
# 查询 Sentinel-1 产品、绘制轨道覆盖图、按人工确认结果安全下载，并在 BURST 模式下
# 合并为 GAMMA TOPS SLC 可读取的 SAFE。正式任务名：
# PRE_COMMON_SENTINEL1_ACQUISITION。
#
# 适用范围
# - BURST、SLC、GRD 三种 ASF Sentinel-1 产品；
# - KML 或 bbox 研究区；自动/手动轨道和升降轨；
# - BURST 下载后用 burst2safe 合并为 SAFE。
#
# 不适用范围
# - 本命令不生成 GAMMA SLC、参考几何、RSLC、干涉图或形变结果；
# - GRD 不进入当前 InSAR TOPS 链；SLC/GRD 不需要 --merge。
#
# 上一步：准备项目 KML，确认 Earthdata 的 ~/.netrc 或运行时环境变量。
# 下一步：BURST 依次执行 --query、--download、--merge；然后运行
# gamma_slc_tops.cfg。SLC 下载完成后可直接进入 TOPS SLC。
#
# 查看帮助：
#   geodesy-pre-sar-sentinel1-acquire --help
#
# 正式运行：
#   geodesy-pre-sar-sentinel1-acquire --config PROJECT/config/download/sentinel1_download.cfg --case main --query
#   geodesy-pre-sar-sentinel1-acquire --config PROJECT/config/download/sentinel1_download.cfg --case main --download
#   geodesy-pre-sar-sentinel1-acquire --config PROJECT/config/download/sentinel1_download.cfg --case main --merge
#
# 结果保存
# - query_dir：查询 CSV、覆盖图、下载链接、images_NNN、query_manifest.json；
# - 默认 download_dir/Orbit_NNN：下载文件和已验证 SAFE；
# - 明确单轨且使用 flat 时：文件和 SAFE 直接保存在 download_dir；
# - download_dir/source_manifest.json、download_dir/safe_manifest.json：来源与合并清单。
#
# 日志
# 直接运行在终端显示统一逐文件进度；Workflow 完整日志位于
# PROJECT/LOG/PRE/COMMON/SENTINEL1_ACQUISITION/。
#
# 完成判断
# query_manifest.json 必须为当前 CFG/KML；download 后 source_manifest.json 全部产品状态
# 为 downloaded 或 existing；BURST merge 后 safe_manifest.json 包含该分组，且 SAFE
# 内 manifest.safe、annotation 和 measurement 均存在。
#
# 重新运行
# 相同输入安全跳过。修改日期、研究区、产品类型、极化、方向或轨道后必须重新
# --query；旧指纹不会继续下载。残缺或来源不一致的正式 SAFE 不会被自动覆盖。
#
# 凭据安全
# CFG 不填写用户名、password、token、Cookie 或 API key。按优先级使用：
# 1. export EARTHDATA_TOKEN="临时令牌"；
# 2. EARTHDATA_USERNAME 与 EARTHDATA_PASSWORD；
# 3. ~/.netrc 中 machine urs.earthdata.nasa.gov。
# =============================================================================

[project]
# 此项必须填写。项目根目录；相对路径按本 CFG 所在目录解析。
root = ../..

[defaults]
# 下面的选项和极化值均不区分大小写。
# 唯一选项及默认值为 asf（Alaska Satellite Facility）。
provider = asf

# BURST、SLC、GRD。默认 BURST，也是唯一支持 --merge 的产品类型。
product_type = BURST

# BURST 可选 IW（默认）、EW。SLC 或 GRD 还可用 S1、S2、S3、S4、S5、S6、WV。
beam_mode = IW

# 可选 HH、HV、VH、VV，多个值用逗号分隔且不可重复。默认 auto（不限极化）。
polarizations = VV

# 可填 auto（默认，不筛选）或逗号分隔的不重复正整数轨道，例如 1,74,154。
tracks = auto

# 可选 auto（默认，不筛选升降轨）、ascending（升轨）或 descending（降轨）。
orbit_direction = auto

# 研究区最低联合覆盖率，范围 (0,1]。
coverage_threshold = 0.999

# 并行下载数 1-32、单文件重试数 0-20、重试间隔秒数。
download_threads = 2
max_retries = 3
retry_delay_seconds = 10

# true、yes、on、1 为合并成功后保留 BURST 文件（默认）。
# false、no、off、0 为合并成功后删除本任务的 BURST 文件。仅 --merge 时生效。
keep_burst_files = true

# orbit_subdirectories（默认）按 Orbit_NNN 分轨。flat 直接写入下载根目录，
# 要求 tracks 为一个明确轨道。
download_layout = orbit_subdirectories

[case:main]
# 必须在 KML 路径与 bbox 之间选填一项。KML 必须位于项目根目录内。
kml_file = S1/ROI.kml
# bbox = -5.4,39.6,-3.8,41.1

# 查询日期，YYYY-MM-DD；结束日期不得早于开始日期。
start_date = 2026-09-01
end_date = 2026-09-30

# 项目内查询审查目录和下载根目录。
query_dir = S1/QUERY/ascending
download_dir = S1/DOWNLOAD/ascending

# PATH CONTRACT / 处理链路径契约
# STEP / 步骤：ACQUISITION · topography download/conversion
# RUN / 运行：geodesy-pre-dem --config PROJECT/config/download/opentopo_dem_download.cfg --dry-run
# 去掉 --dry-run 后执行下载和已启用的转换。
# ROOT / 根目录：project_root 是研究项目根目录；dataset_id 标识 DEM 数据集。
# INPUTS / 输入：ROI/bbox 与运行时 OpenTopography API key。
# OUTPUTS / 输出：TOPOGRAPHY/<dataset>/SOURCE 与 GAMMA。
# DOWNSTREAM / 下游：PRE 的 RSLC/GEOCODING 读取 GAMMA DEM。
# RERUN / 重跑：已验证 GeoTIFF 可作为下载缓存复用；启用 GAMMA 转换时每次都重新转换。

# =============================================================================
# OpenTopography DEM 下载及可选 GAMMA 转换
# 功能用途：下载公共 DEM，本模板启用 srtm2dem 生成 GAMMA DEM。
# 适用范围：OpenTopography Global DEM 和 GAMMA 地形准备；
# 不适用范围：SAR 配准和分析。上一步：准备研究区范围；下一步：参考几何。
# 结果保存：统一写入 PROJECT/TOPOGRAPHY/<dataset_id>/{SOURCE,GAMMA}。
# 重新运行：遵循文末重跑规则。
#
# 功能：按 KML 或经纬度范围下载并校验 DEM，可在同一次运行中转换为 GAMMA 格式。
# 输入：研究区 KML，或 west/south/east/north 四个 WGS84 边界值。
# 输出：数据集命名的 GeoTIFF、GAMMA DEM，以及下载、转换和数据集清单。
# 适用：OpenTopography Global DEM API 支持的数据集。
# 不适用：地形相位计算、SAR 配准和干涉分析。
# 边界：本步骤在公共 DEM 下载及可选 GAMMA 格式转换后结束。
#
# 前置步骤：准备研究区 KML；若使用 bbox，则不需要 KML。
# 后续步骤：使用生成的 GAMMA DEM 建立 SAR 参考几何。
# 已有本地 GeoTIFF、无需下载时，仍可单独使用 geodesy-pre-gamma-dem-convert。
#
# 复制模板：
#   cp /path/to/opentopo_dem_download.cfg PROJECT/config/download/opentopo_dem_download.cfg
#
# 查看帮助：
#   geodesy-pre-dem --help
#
# 只检查、不下载：
#   geodesy-pre-dem --config PROJECT/config/download/opentopo_dem_download.cfg --dry-run
#
# 正式运行：
#   geodesy-pre-dem --config PROJECT/config/download/opentopo_dem_download.cfg
#
# 本模板会执行 GAMMA 转换。只需要原始 GeoTIFF 时设置 run_srtm2dem=false。
# =============================================================================

# 本模板为无分节 key=value 配置。相对路径通常以本 CFG 所在目录为基准。
# 数据集模式下的 kml_file 相对于 project_root。

# 此项必须填写。项目根目录。模板位于 PROJECT/config/download/ 时为 ../..。
project_root = ../..

# 此项必须填写。地形数据集唯一名称。程序据此创建
# PROJECT/TOPOGRAPHY/area_cop30/SOURCE 和 GAMMA，不再手工拼输出目录。
topography_dataset_id = area_cop30

# 可选 kml（默认）或 bbox，不区分大小写。bbox 模式使用下方四个边界值。
input_mode = kml

# input_mode = kml 时必须填写实际的 KML 路径。
kml_file = ../../ROI.kml

# 类型：文字。留空表示合并 KML 中全部几何；填写时必须唯一匹配。
kml_placemark =

# input_mode = bbox 时必须填写四个边界值，采用 WGS84 十进制度，
# 必须满足 west < east、south < north；经度范围 -180..180，纬度 -90..90。
west =
south =
east =
north =

# 对研究区四周扩展的千米数，不小于 0。省略时不扩展，本模板设为 5。
buffer_km = 5

# 可选 COP30（默认）、COP90、NASADEM、SRTMGL1、SRTMGL1_E、SRTMGL3、
# AW3D30、AW3D30_E、EU_DTM、GEDTM30、GEDI_L3、ANADEM、CA_MRDEM_DSM、
# CA_MRDEM_DTM、SRTM15Plus、GEBCOIceTopo、GEBCOSubIceTopo。
# 别名 SRTM_GL1 对应 SRTMGL1；SRTM_GL1_E、SRTM_GL1_ELLIP 和 SRTM_GL1_ELLIPSOIDAL
# 对应 SRTMGL1_E；SRTM_GL3 对应 SRTMGL3。不区分大小写，连字符和空格按下划线处理。
# 30 m 产品的大区域请求可能超过服务限制，报错时应拆分区域。
dem_type = COP30

# 类型：HTTPS URL。必须保持官方主机，防止密钥发往第三方。
api_url = https://portal.opentopography.org/API/globaldem

# 存放 API 密钥的环境变量名。运行前执行
# export OPENTOPO_API_KEY="YOUR_API_KEY"；这里绝不填写真实密钥。
api_key_env = OPENTOPO_API_KEY

# 允许 GTiff（默认）、AAIGrid、HFA，区分大小写。
# 本模板使用数据集模式，必须填写 GTiff。仅独立下载模式且关闭 GAMMA 转换时可用 AAIGrid 或 HFA。
output_format = GTiff

# 单位：秒。连接和读取超时必须大于 0。
timeout_connect_sec = 30
timeout_read_sec = 600

# 重试次数、退避系数和流式下载块大小（MiB）。
retries = 4
backoff_factor = 2
chunk_mb = 4

# true、yes、y、on、1 启用 GTiff 下载校验（默认）；false、no、n、off、0 禁用。
# 下面布尔值均不区分大小写，留空时使用各自默认值。
verify_tiff = true

# true、yes、y、on、1 写出元数据（默认），数据集模式必须启用。
# 独立下载模式可用 false、no、n、off、0 跳过写入。
write_metadata = true

# false、no、n、off、0 保留同名下载文件（默认），true、yes、y、on、1 允许替换。
# 这个开关只控制下载；--force 可临时允许覆盖已下载文件。
# GAMMA 转换属于处理步骤，正式调用时始终重算并事务式替换旧结果。
overwrite = false

# 记录来源高程基准，仅写入元数据，不会自动执行基准转换。
source_vertical_datum = unspecified

# false、no、n、off、0 为正式运行（默认），true、yes、y、on、1 仅检查。
# 也可用命令行 --dry-run 临时开启检查模式。
dry_run = false

# -----------------------------------------------------------------------------
# 下载后的可选 GAMMA 转换
# -----------------------------------------------------------------------------
# true、yes、y、on、1 启用下载后转换（本模板设置）。
# false、no、n、off、0 只下载（省略时采用）。下方 srtm2dem 参数控制转换。
run_srtm2dem = true

# GAMMA 命令名。输出名和目录由 topography_dataset_id 唯一确定。
srtm2dem_command = srtm2dem

# 0（默认）不改高程，空值用接近零的有效值替换。1 使用 GAMMA 默认常量偏移 0 m。
# 2 使用插值后的 WGS84 大地水准面偏移，须提供 geoid 文件。3 不改高程，空值置 0.0。
srtm2dem_geoid_correction_flag = 0
# 仅 flag=2 时使用，填写 GeoTIFF 或配有参数文件的 GAMMA DEM。
srtm2dem_geoid_file =
srtm2dem_gdal_bin_dir =

# =============================================================================
# 结果和日志
#   结果：../../TOPOGRAPHY/area_cop30/SOURCE/area_cop30.tif 与
#         ../../TOPOGRAPHY/area_cop30/GAMMA/area_cop30.dem(.par)。
#   清单：SOURCE/download_manifest.json、GAMMA/conversion_manifest.json、
#         topography_manifest.json 和 TOPOGRAPHY/catalog.json。
#   日志：本命令输出到终端；Workflow 调用时写入项目 LOG/PRE/COMMON。
#
# 完成判断
#   1. GeoTIFF 和元数据存在；
#   2. run_srtm2dem=true 时 GAMMA DEM、参数和日志均存在并通过尺寸校验；
#   3. 终端没有 ERROR。
#
# 重跑规则
#   - 已有 GeoTIFF 会校验后复用，不再次联网；
#   - GAMMA 转换每次正式调用都执行，新结果成功后成组替换旧结果；
#   - 下载使用同目录临时文件，失败不会发布半成品；
#   - 只在需要重新下载 GeoTIFF 时使用 --force 或 overwrite=true。
#
# 常见问题
#   1. API key not found：检查环境变量名和当前终端是否已 export。
#   2. request limit：缩小或拆分 KML/bbox。
#   3. CRS/coverage 错误：检查服务响应和研究区经纬度顺序。
#   4. srtm2dem command not found：确认已激活配置好 GAMMA 的环境。
#
# 凭据安全
#   密钥只从环境变量读取；不要把真实密钥写进 CFG、日志或 Git。
# =============================================================================

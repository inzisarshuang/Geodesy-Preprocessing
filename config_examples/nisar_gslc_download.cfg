# =============================================================================
# NISAR L2 GSLC 查询、覆盖审查与下载（公共获取步骤）
#
# 功能用途
#   根据项目 KML 和日期查询 ASF/Earthdata 上的 NISAR L2 GSLC，生成轨道/帧
#   覆盖图和表格。由人检查后，下载选定的 HDF5 科学产品。
#
# 适用范围
#   NISAR L2 GSLC；默认 L 波段 Frequency A（LA）。需要后续双频分析准备时，
#   可显式选择 main_plus_auxiliary，同时要求 Frequency A 和 B。
#
# 不适用范围
#   本命令不调用 GAMMA，不生成 RSLC，不做复数重采样，不生成干涉图、
#   相干性、解缠或形变结果。RIFG、RUNW、GUNW、GCOV 也不在此模板范围内。
#
# 上一步
#   准备项目目录和 WGS84 Polygon/MultiPolygon KML。
#
# 下一步
#   下载完成后，用 nisar_gslc_stack.cfg 和 geodesy-pre-sar-nisar-gslc 检查网格、
#   按 KML 缓冲区裁剪并发布地理网格复数栈。
#
# Workflow 任务名
#   PRE_COMMON_NISAR_ACQUISITION
#
# 复制模板
#   cp /path/to/nisar_gslc_download.cfg PROJECT/CONFIG/preprocessing/nisar_gslc_download.cfg
#
# 查看帮助
#   geodesy-pre-sar-nisar-acquire --help
#
# 第一次查询（只查元数据，不下载、不读取凭据）
#   geodesy-pre-sar-nisar-acquire --config PROJECT/CONFIG/preprocessing/nisar_gslc_download.cfg --case main --query
#
# 正式运行：检查 PNG/CSV，把 tracks 和 frames 改为选定值，重新查询后下载
#   geodesy-pre-sar-nisar-acquire --config PROJECT/CONFIG/preprocessing/nisar_gslc_download.cfg --case main --query
#   geodesy-pre-sar-nisar-acquire --config PROJECT/CONFIG/preprocessing/nisar_gslc_download.cfg --case main --download
# =============================================================================

[project]
# 【必填】【常改】项目根目录；本 CFG 中的数据路径必须位于该目录内。
root = /absolute/path/to/PROJECT

[defaults]
# 【通常不改】本模板只查询 NISAR L2 GSLC。
product_type = GSLC
# 【通常不改】NASA/ASF 正式链为 L 波段。
band = L
# 【通常不改】查询提供商。
provider = asf
# 【常改】main_only 只要求 A；main_plus_auxiliary 同时要求 A/B。
frequency_mode = main_only
# 【常改】首次查询保持 auto；正式下载时一个 case 只保留一条轨道。
tracks = auto
# 【常改】首次查询保持 auto；正式 stack 一个 case 只保留一帧。
frames = auto
# 【常改】auto、ascending 或 descending。
orbit_direction = auto
# 【通常不改】查询成果与原始只读 HDF5 目录。
query_dir = INPUT/NISAR/QUERY/GSLC
download_dir = INPUT/NISAR/GSLC

[case:main]
# 【必填】【常改】WGS84 研究区 KML。
kml_file = INPUT/ROI/area.kml
# 【必填】【常改】查询起止日期，包含边界日期。
start_date = 2026-01-01
end_date = 2026-12-31
# 【必填】【常改】需要的极化，多个值用逗号分隔。
polarizations = HH
# 【谨慎修改】确认覆盖图后再取消注释，不要凭文件名猜测。
# tracks = 87
# frames = 22
# orbit_direction = ascending
# frequency_mode = main_plus_auxiliary

# =============================================================================
# 结果保存
#   INPUT/NISAR/QUERY/GSLC/NISAR_GSLC_footprints_all.png
#   INPUT/NISAR/QUERY/GSLC/NISAR_GSLC_footprints_selected.png
#   INPUT/NISAR/QUERY/GSLC/NISAR_GSLC_all.csv
#   INPUT/NISAR/QUERY/GSLC/NISAR_GSLC_track_coverage.csv
#   INPUT/NISAR/QUERY/GSLC/NISAR_GSLC_filtered.csv
#   INPUT/NISAR/QUERY/GSLC/NISAR_GSLC_download_urls_trackNNN.txt
#   INPUT/NISAR/QUERY/GSLC/query_manifest.json
#   INPUT/NISAR/GSLC/*.h5
#   INPUT/NISAR/GSLC/source_manifest.json
#
# 日志
#   直接运行时进度显示在终端；Workflow 任务 PRE_COMMON_NISAR_ACQUISITION 写入
#   PROJECT/LOG/PRE/COMMON/NISAR_ACQUISITION。
#
# 完成判断
#   查询完成：两张 PNG、CSV 和 query_manifest.json 完整，人工确认覆盖后再下载。
#   下载完成：每个选中产品都有 .h5，无 .part，source_manifest.json 为完成状态。
#
# 重新运行
#   查询事务替换旧查询产物；下载可从 .part 续传，完整且校验通过的 HDF5 会复用。
#
# 常见失败
#   - stale query fingerprint：KML 或筛选参数已变，必须重新 --query。
#   - Earthdata authentication failed：检查 .netrc 或当前终端环境变量。
#   - HDF5 identity mismatch：下载文件不是查询选中的 GSLC 科学产品。
#
# 凭据安全
#   CFG 中严禁填写用户名、密码、Cookie、API key 或 token。下载时仅使用：
#   1. ~/.netrc（machine urs.earthdata.nasa.gov）；
#   2. EARTHDATA_TOKEN；
#   3. EARTHDATA_USERNAME 和 EARTHDATA_PASSWORD 运行时环境变量。
# =============================================================================

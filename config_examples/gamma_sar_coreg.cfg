# =============================================================================
# GAMMA 普通雷达坐标 SLC → RSLC 配准
# 功能用途：把一个单频 SLC 栈配准到明确参考日期，发布完整 RSLC 栈清单。
# 适用范围：NISAR、ALOS-2、COSMO、LT-1、RADARSAT-2、SAOCOM 雷达坐标 SLC。
# 不适用范围：Sentinel-1 TOPS、GSLC、干涉、滤波、解缠或形变分析。
# 上一步：geodesy-pre-gamma-sar-geo-ref 已发布 reference_geometry.json。
# 下一步：geodesy-pre-gamma-sar-rslc-crop 按 KML 缓冲区裁剪完整注册栈。
#
# 查看帮助：
#   geodesy-pre-gamma-sar-coreg --help
# 只检查，不运行：
#   geodesy-pre-gamma-sar-coreg --config PROJECT/NISAR/TRACK087_FRAME022_LA/config/preprocessing/gamma_sar_coreg.cfg --case nisar_la --dry-run
# 正式运行：
#   geodesy-pre-gamma-sar-coreg --config PROJECT/NISAR/TRACK087_FRAME022_LA/config/preprocessing/gamma_sar_coreg.cfg --case nisar_la
# =============================================================================

[project]
# 【必填】【常改】项目根目录；其他相对路径均从这里解析且不能越界。
root = /path/to/research-project

[defaults]
# 【常改】必须与参考几何和后续裁剪采用的视数一致。
range_looks = 5
azimuth_looks = 3
# 【通常不改】standard 使用 SLC_coreg.py；仅有明确需要时改为 offset_field。
refinement = standard
# 【通常不改】auto：LT-1 自动为 0（单程），其余受支持卫星为 1（重复轨）。
sar_mode = auto
# 【谨慎修改】像元单位。达到 warning 会发布并记录告警，达到 failure 则禁止发布。
warning_offset_stddev = 0.15
failure_offset_stddev = 0.30
warning_residual_offset = 0.20
failure_residual_offset = 0.50

# 【通常不改】SLC_coreg.py 的初始偏移拟合参数，对应旧 offset_fit 末尾的 6。
# 只能取 1、3、4、6；常规二维仿射拟合保持 6。
offset_polynomial_parameters = 6
# 【分辨率变化时检查】初始偏移估计在距离向/方位向使用的估计点数量。
# 对应 SLC_coreg.py 的 --nr/--naz；旧流程两项均为 128。
offset_range_estimates = 128
offset_azimuth_estimates = 128
# 【弱相关时谨慎调整】初始相关窗口，对应 --rwin/--azwin 和旧 offset_pwr 的 256 256。
# 较大窗口通常更稳但更慢，并可能平滑局部变化；不得小于 8。
offset_range_window = 256
offset_azimuth_window = 256
# 【通常不改】初始相关过采样与最低相关系数，对应 --n_ovr/--thres。
# 过采样只能取 1、2、4；阈值在 0 到 1 之间。弱相关时先检查数据和窗口，再降低阈值。
offset_oversampling = 1
offset_correlation_threshold = 0.35

# 【仅 refinement=offset_field 时生效】精配准网格步长，对应 --rstep/--azstep。
refine_range_step = 128
refine_azimuth_step = 128
# 【仅 refinement=offset_field 时生效】精配准相关窗口，对应 --rwin/--azwin。
refine_range_window = 256
refine_azimuth_window = 256
# 【仅 refinement=offset_field 时生效】精配准过采样和最低相关系数。
refine_oversampling = 1
refine_correlation_threshold = 0.35

[case:nisar_la]
# 【必填】项目相对 case 根；输出固定在其 PRE/GAMMA 下。
case_root = NISAR/TRACK087_FRAME022_LA
# 【必填】【常改】允许 nisar、alos2、saocom、rsat2、cosmo、lt1。
sensor = nisar
# 【必填】【常改】一个 case 只能处理一个频段；NISAR LA 写 A，LB 另建 case 写 B。
frequency = A
# 【必填】【常改】从筛选 CSV/HDF5 核对；一个 case 只能包含同一轨道、帧和方向。
track = 87
frame = 22
orbit_direction = descending
# 【必填】【常改】必须与 reference_geometry.json 和 images_file 一致。
reference_date = 20240229
# 【必填】【常改】负责估计 lookup/off 的极化；可以是任意已选极化。
primary_polarization = HH
# 【必填】【常改】逗号分隔。次极化仅在网格、轨道和采集几何一致时复用主极化。
selected_polarizations = HH
# 【必填】【常改】SLC 根目录，例如 HH_SLC/YYYYMMDD/YYYYMMDD.slc。
slc_dir = NISAR/TRACK087_FRAME022_LA/PRE/GAMMA/SLC
# 【必填】【常改】完整、唯一的 YYYYMMDD 日期清单。
images_file = NISAR/TRACK087_FRAME022_LA/PRE/GAMMA/SLC/images_nisar_la
# 【必填】【常改】上一阶段发布的参考几何清单。
reference_geometry = NISAR/TRACK087_FRAME022_LA/PRE/GAMMA/GEOMETRY/reference_geometry.json
# 【必填】【常改】事务式 RSLC 输出；残缺目录不会自动覆盖。
output_dir = NISAR/TRACK087_FRAME022_LA/PRE/GAMMA/RSLC

# 可选 Frequency B；它必须独立配准，不能复用 LA 的像元尺寸或 lookup table。
[case:nisar_lb]
case_root = NISAR/TRACK087_FRAME022_LB
sensor = nisar
frequency = B
track = 87
frame = 22
orbit_direction = descending
reference_date = 20240229
primary_polarization = HH
selected_polarizations = HH
slc_dir = NISAR/TRACK087_FRAME022_LB/PRE/GAMMA/SLC
images_file = NISAR/TRACK087_FRAME022_LB/PRE/GAMMA/SLC/images_nisar_lb
reference_geometry = NISAR/TRACK087_FRAME022_LB/PRE/GAMMA/GEOMETRY/reference_geometry.json
output_dir = NISAR/TRACK087_FRAME022_LB/PRE/GAMMA/RSLC

# =============================================================================
# 处理逻辑
#   主极化非参考景：SLC_coreg.py；次极化：SLC_interp_lt 复用主极化几何；
#   offset_field 模式在标准配准后显式调用 SLC_coreg_refine.py。
#   固定任务标识：PRE_GAMMA_SAR_RADAR_COREG。
#
# 结果保存
#   output_dir 内含各日期/极化 RSLC、RMLI、lookup/off、逐景质量、images、
#   quality.json、provenance.json 和 registered_stack.json。
#
# 日志
#   Workflow 分类建议使用 LOG/PRE/GAMMA/SAR_RADAR_GRID_COREG；每景命令 stdout/stderr
#   随发布目录保留在 logs/日期/极化，便于定位具体失败景。
#
# 完成判断
#   1. 终端所有景为 reference/complete/warning，无 failed；
#   2. registered_stack.json 可读取且引用完整日期 × 极化网格；
#   3. quality.json 没有 failed；真实中心频率来自每个 .slc.par 且全栈一致。
#
# 重新运行
#   完整且清单有效的栈自动跳过；任何残缺目录都先报错。人工核对并移动旧目录后
#   才能重算，程序不会静默覆盖或递归删除已有成果。
#   完整目录只有在输入和参数摘要一致时才跳过；失败日志保存在输出同级的
#   `<目录>.failed-logs-<编号>` 中。
#
# 凭据安全
#   本步骤不联网，不需要账号、密码、令牌或 API key；CFG 不得保存凭据。
# =============================================================================

# GAMMA 注册栈 KML 裁剪配置（正式模板）
# 功能用途：根据研究区 KML 和外扩缓冲区，为完整 GAMMA RSLC 注册栈计算统一窗口，
#           检查覆盖范围，并把所选极化裁剪成预处理最终产品。
# 适用范围：已经完成配准并具有 registered_stack.json、mli.par、utm.dem.par 和
#           lt_fine 的 GAMMA radar-grid 注册栈。
# 不适用范围：未配准 SLC、NISAR GSLC、干涉图生成、滤波、解缠或时序分析。
# 上一步：geodesy-pre-gamma-sar-tops-coreg 或其他能发布兼容注册栈清单的配准程序。
# 下一步：在 Geodesy-Analysis 中从裁剪栈开始 baseline_select 和干涉分析。
#
# 查看帮助：
#   conda run -n envInSAR geodesy-pre-gamma-sar-rslc-crop --help
# 先检查范围，不裁剪 RSLC：
#   conda run -n envInSAR geodesy-pre-gamma-sar-rslc-crop \
#     --config <项目>/config/preprocessing/gamma_sar_rslc_crop.cfg \
#     --case main --plan-only
# 正式运行：
#   conda run -n envInSAR geodesy-pre-gamma-sar-rslc-crop \
#     --config <项目>/config/preprocessing/gamma_sar_rslc_crop.cfg --case main
#
# 结果保存：output_dir 下包含 RSLC、registered_stack.json、images、crop_window.json、
#           KML 缓冲区、地图/雷达掩膜和 quicklooks；完整源 RSLC 不会被修改。
# 日志：Workflow 运行时写入项目 LOG/PRE/GAMMA；直接运行时显示简洁进度。
# 完成判断：命令返回 0，输出清单状态 complete，全部日期和所选极化均有非空
#           .rslc/.rslc.par，crop_window.json 记录覆盖率和同一裁剪窗口。
# 重新运行：相同输入和参数的完整结果会整体跳过；冲突或不完整目录会停止。
#           只有确认目标可替换时才使用 --force，源注册栈始终只读。
# 凭据安全：本步骤不联网，不要在本文件写账号、密码、API key 或 token。

[project]
# 【必填】所有相对路径的基准；通常从 config/preprocessing 返回项目根目录。
root = ../..

[defaults]
# 【常改】KML 向外缓冲公里数；默认 5 km，避免研究区边缘被裁掉。
buffer_km = 5
# 【常改】逗号分隔极化，如 VV、HH,HV；使用 all 表示清单中的全部极化。
polarizations = VV
# 【通常不改】原始 KML 必须全部位于有效 lookup 覆盖内。
require_full_aoi_coverage = true
# 【谨慎修改】缓冲区最低覆盖比例。0.95 表示至少覆盖 95%。
min_buffer_coverage = 0.95

[case:main]
# 【必填】【常改】完整配准栈发布的 v2 清单。
registered_stack = RAW_2026/RSLC_154/registered_stack.json
# 【必填】【常改】包含参考日期 mli.par、utm.dem.par 和 lt_fine 的目录。
geometry_dir = RAW_2026/DEM_geocode_154
# 【必填】【常改】项目内 WGS84 Polygon/MultiGeometry KML。
kml_file = AOI/study_area.kml
# 【通常不改】留空表示合并 KML 中所有 Polygon；填写时只读取同名 Placemark。
kml_placemark =
# 【必填】【常改】裁剪注册栈正式目录；不得等于或位于完整 RSLC 目录内部。
output_dir = RAW_2026/RSLC_CROP_154

# NISAR LA 的连贯路径示例；这是 NISAR 常规预处理默认使用的 case。
[case:nisar_la]
registered_stack = WORK/GAMMA/NISAR/LA/RSLC/registered_stack.json
geometry_dir = WORK/GAMMA/NISAR/LA/GEOMETRY
kml_file = INPUT/ROI/area.kml
kml_placemark =
output_dir = WORK/GAMMA/NISAR/LA/RSLC_CROP
polarizations = HH

# 可选 LB；只有完成独立 LB 导入、几何和配准后才运行。
[case:nisar_lb]
registered_stack = WORK/GAMMA/NISAR/LB/RSLC/registered_stack.json
geometry_dir = WORK/GAMMA/NISAR/LB/GEOMETRY
kml_file = INPUT/ROI/area.kml
kml_placemark =
output_dir = WORK/GAMMA/NISAR/LB/RSLC_CROP
polarizations = HH

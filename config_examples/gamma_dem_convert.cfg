# =============================================================================
# GAMMA DEM 转换（srtm2dem）
# 功能用途：把已下载的 GeoTIFF 转为 GAMMA DEM；适用范围：GAMMA 地形准备；
# 不适用范围：下载、配准和分析。上一步：DEM 下载；下一步：参考几何。
# 结果保存：由 output_dem/output_par/log_file 指定。重新运行：遵循文末重跑规则。
#
# 功能：把已下载并校验的 GeoTIFF 转换成 GAMMA REAL*4 DEM 和参数文件。
# 输入：一份 GeoTIFF DEM；geoid_correction_flag=2 时还需要 geoid 文件。
# 输出：srtm.dem、srtm.dem.par 和转换日志。
# 适用：安装并配置好 GAMMA 的环境，以及 GAMMA 支持的 GeoTIFF。
# 不适用：DEM 下载、SAR SLC 生成、配准、干涉或形变分析。
# 边界：本步骤只准备 GAMMA 地形文件，不计算雷达几何或地形相位。
#
# 前置步骤：geodesy-pre-dem 下载公共 DEM，或准备等价的 GeoTIFF。
# 后续步骤：GAMMA SAR 参考几何或配准步骤。
#
# 复制模板：
#   cp /path/to/gamma_dem_convert.cfg PROJECT/CONFIG/preprocessing/gamma_dem_convert.cfg
#
# 查看帮助：
#   geodesy-pre-gamma-dem-convert --help
#
# 只检查、不处理：
#   geodesy-pre-gamma-dem-convert --config PROJECT/CONFIG/preprocessing/gamma_dem_convert.cfg --dry-run
#
# 正式运行：
#   geodesy-pre-gamma-dem-convert --config PROJECT/CONFIG/preprocessing/gamma_dem_convert.cfg
# =============================================================================

# -----------------------------------------------------------------------------
# [project]
# 定义研究项目根目录。defaults 和 case 中的所有相对路径都从这里解析。
# -----------------------------------------------------------------------------
[project]

# 【必填】【常改】类型：路径。不要填写公共代码仓库作为项目输出目录。
root = /path/to/research-project

# -----------------------------------------------------------------------------
# [defaults]
# 定义本文件唯一 case 继承的 GAMMA 命令和转换选项。case 可覆盖这些键。
# -----------------------------------------------------------------------------
[defaults]

# 【通常不改】类型：命令名或可执行文件路径。需在已配置 GAMMA 的终端可用。
command = srtm2dem

# 【谨慎修改】允许值：0、1、2、3，默认 0。该值决定高程基准处理；必须根据
# 输入 DEM 的垂向基准和 GAMMA 版本确认，不能因为命令成功就假定基准正确。
geoid_correction_flag = 0

# 【常改】类型：项目相对路径。仅 geoid_correction_flag=2 时必填。
geoid_file =

# 【通常不改】类型：目录。仅在 GAMMA 找不到兼容 GDAL 时填写其 bin 目录。
gdal_bin_dir =

# 【谨慎修改】类型：布尔值，默认 false。true 会成组替换 DEM、参数和日志。
overwrite = false

# -----------------------------------------------------------------------------
# [case:main]
# 一个 CFG 只允许一个 case；命令会直接执行该 case，不需要额外 --case 参数。
# -----------------------------------------------------------------------------
[case:main]

# 【必填】【常改】类型：路径。通常与 opentopo_dem_download.cfg 的 output_dir/output_name
# 指向同一文件；相对 [project] root 解析。
input_geotiff = INPUT/DEM/dem.tif

# 【必填】【常改】类型：路径。以下三项必须位于同一目录，便于成组发布和恢复。
output_dem = WORK/GAMMA/DEM/srtm.dem
output_par = WORK/GAMMA/DEM/srtm.dem.par
log_file = WORK/GAMMA/DEM/srtm2dem.log

# =============================================================================
# 结果和日志
#   结果：PROJECT/WORK/GAMMA/DEM/srtm.dem 和 srtm.dem.par。
#   日志：PROJECT/WORK/GAMMA/DEM/srtm2dem.log；Workflow 运行记录另存于
#         PROJECT/LOG/PRE/GAMMA。
#
# 完成判断
#   1. DEM、参数文件和日志全部存在；
#   2. 参数文件声明 data_format: REAL*4、正数 width 和 nlines；
#   3. DEM 字节数严格等于 width × nlines × 4。
#
# 重跑规则
#   - 完整且校验通过的结果自动跳过；
#   - 只存在部分结果时立即报错，不会静默删除；
#   - 只有 overwrite=true 才成组替换旧结果，失败时恢复原文件；
#   - 输入或输出本身是符号链接时拒绝执行，防止改写项目外文件。
#
# 常见问题
#   1. command not found：先进入安装 GAMMA 的终端并检查 which srtm2dem。
#   2. incomplete output：检查残缺文件和日志，再决定修复或显式覆盖。
#   3. geoid file not found：flag=2 时核对项目相对路径和 GDAL 兼容性。
#
# 凭据安全
#   本步骤不使用网络账户或 API 密钥，CFG 中不应出现任何凭据。
# =============================================================================

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geodesy-preprocessing"
version = "0.8.0"
description = "Acquisition and preprocessing primitives for geodetic workflows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "shapely>=2.0",
  "requests>=2.31",
  "rasterio>=1.3",
  "pyproj>=3.6",
  "asf-search>=12,<13",
  "h5py>=3.10",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]

[project.scripts]
geodesy-pre-dem = "geodesy_preprocessing.dem.cli:main"
geodesy-pre-gamma-dem-convert = "geodesy_preprocessing.dem.conversion.gamma.cli:main"
geodesy-pre-gamma-sar-slc = "geodesy_preprocessing.sar.slc_generation.gamma.radar_grid.cli:main"
geodesy-pre-gamma-sar-tops-slc = "geodesy_preprocessing.sar.slc_generation.gamma.tops.config_cli:main"
geodesy-pre-gamma-sar-tops-geo-ref = "geodesy_preprocessing.sar.rslc_registration.gamma.tops.geo_ref_config_cli:main"
geodesy-pre-gamma-sar-tops-coreg = "geodesy_preprocessing.sar.rslc_registration.gamma.tops.coreg_config_cli:main"
geodesy-pre-gamma-sar-geo-ref = "geodesy_preprocessing.sar.rslc_registration.gamma.radar_grid.geo_ref_cli:main"
geodesy-pre-gamma-sar-coreg = "geodesy_preprocessing.sar.rslc_registration.gamma.radar_grid.coreg_cli:main"
geodesy-pre-gamma-sar-rslc-crop = "geodesy_preprocessing.sar.rslc_subsetting.gamma.radar_grid.cli:main"
geodesy-pre-sar-nisar-acquire = "geodesy_preprocessing.sar.acquisition.nisar.cli:main"
geodesy-pre-sar-nisar-gslc = "geodesy_preprocessing.sar.gslc_subsetting.nisar.cli:main"
geodesy-pre-sar-sentinel1-acquire = "geodesy_preprocessing.sar.acquisition.sentinel1.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/geodesy-preprocessing/config_examples" = ["config_examples/*.cfg"]
